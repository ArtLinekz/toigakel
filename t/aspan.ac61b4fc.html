*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;background:#c4d8ec;font-family:'Cormorant Garamond','Noto Serif',serif;color:var(--tx)}body.lk{overflow:hidden}
#inv{max-width:460px;margin:auto;position:relative;background:var(--wc) top/100% auto repeat-y #c8dcee;overflow:hidden;padding:46px 0 70px}
.panel{position:relative;margin:0 7.5% 0 8.5%;background:#fff;box-shadow:0 0 0 5px #fff6,0 6px 30px #5a7a9a33;border:6px solid transparent;border-image:linear-gradient(135deg,#e7c56a,#9b7425 35%,#e9cf7c 55%,#8a6a22 80%,#d9b457) 1}
.s{position:relative;padding:54px 20px 44px;text-align:center}
.tp{position:absolute;left:0;top:0;width:100%;height:0;z-index:5;pointer-events:none}
.ban{position:absolute;top:-46px;width:21%;max-width:96px;filter:drop-shadow(1px 3px 3px #0003)}.b1{left:-7%}.b2{left:15%;top:-46px;width:23%;max-width:104px}.b2 svg{transform:scaleY(1.15);transform-origin:top}
.shy{position:absolute;right:-14%;top:-40px;width:46%;max-width:210px;filter:drop-shadow(-5px 7px 7px #0004);animation:spin 90s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.rings{position:absolute;left:-17%;bottom:-70px;width:72%;max-width:330px;z-index:5;pointer-events:none}
.fl{display:block;margin:12px auto}
.cap{font-size:17px;letter-spacing:.22em;text-transform:uppercase;color:var(--go2);margin:8px 0 6px}
.hero{padding-top:200px;padding-bottom:30px}
.hero .nm{font:400 46px/1.1 'Bad Script','Cormorant Garamond',cursive;color:var(--br);overflow-wrap:anywhere}
.hero .and{font:italic 24px 'Cormorant Garamond',serif;color:var(--go2);margin:2px 0}
.hero .kd{font-size:21px;letter-spacing:.16em;text-transform:uppercase;color:var(--tx);margin-top:6px}
.hero .dt{font-size:24px;font-weight:600;color:var(--br);margin-top:14px;letter-spacing:.06em}
.msg{font-size:20px;line-height:1.6;margin:0}
.photo{width:78%;margin:18px auto 4px;aspect-ratio:3/4;border:1.5px solid var(--go);padding:6px;border-radius:200px 200px 6px 6px;background:#fff}
.photo i{display:block;width:100%;height:100%;border-radius:194px 194px 2px 2px;background-size:cover;background-position:center}
.big{font-size:27px;font-weight:600;color:var(--br)}.sm{font-size:19px;line-height:1.5;overflow-wrap:anywhere}
.mb{display:inline-block;margin-top:14px;padding:12px 26px;min-height:44px;border-radius:99px;background:linear-gradient(135deg,#d9b457,#a47b2a);color:#fff;text-decoration:none;font:500 12px Inter,sans-serif;letter-spacing:.14em;text-transform:uppercase;box-shadow:0 4px 14px #a47b2a55}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:8px 0;max-width:280px;margin:14px auto 0;font-size:17px}.cal i{font:normal 9px Inter,sans-serif;opacity:.6;letter-spacing:.06em}
.cal b{font-weight:400;height:28px;line-height:28px;width:28px;margin:auto}.cal .hl{border:1.5px solid var(--go);border-radius:50%;color:var(--br);font-weight:600}
.cd{display:flex;gap:18px;justify-content:center;margin:14px 0 0}.cd b{display:block;font-size:34px;font-weight:500;line-height:1;color:var(--br)}.cd small{font:9px Inter,sans-serif;letter-spacing:.14em;opacity:.7}
.dc{margin-top:8px;font-size:19px}.dc b{display:inline-block;margin:2px 6px;padding:2px 14px;border:1px solid var(--go);border-radius:99px;font-weight:500}
.rs input{width:100%;padding:12px 16px;min-height:44px;border-radius:99px;border:1px solid var(--go);background:#fffdf7;font:14px Inter,sans-serif;color:var(--tx);margin:10px 0 4px}
.bt{display:block;width:100%;padding:11px 14px;min-height:44px;margin:9px 0;border-radius:99px;border:1px solid var(--go);background:transparent;color:var(--tx);font:500 13px Inter,sans-serif;cursor:pointer}.bt.on{background:#f4e6bd}.bt.mg{background:linear-gradient(135deg,#d9b457,#a47b2a);color:#fff;border:0}
.ft{padding:30px 20px 100px}
.rvl{opacity:0;transform:translateY(24px);transition:opacity 1.1s,transform 1.1s cubic-bezier(.2,.7,.2,1)}.rvl.in{opacity:1;transform:none}#inv.static .rvl{opacity:1;transform:none;transition:none}#inv.static .shy{animation:none}
.fp{position:fixed;left:50%;bottom:calc(8px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#fff;color:#444;font:500 10px Inter,sans-serif;padding:3px 14px;border-radius:99px;z-index:15;opacity:.9;pointer-events:none}
.fab{position:fixed;bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:20;width:44px;height:44px;border-radius:50%;border:0;background:#4a3a28cc;color:#fff;font-size:18px;cursor:pointer}.fab.e{right:14px}.fab.m{left:14px;display:none}
#env{position:fixed;inset:0;z-index:50;cursor:pointer;background:var(--wc) center/cover #c8dcee;display:flex;align-items:center;justify-content:center;transition:opacity .9s,visibility .9s}
#env.open{opacity:0;visibility:hidden}
.ec{width:min(78vw,340px);aspect-ratio:3/4.3;background:#fff;border:6px solid #c9a24a;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;box-shadow:0 10px 40px #5a7a9a66;padding:20px}
.ec h1{font:400 34px/1.15 'Bad Script',cursive;color:var(--br);margin:10px 0}.ec p{font:600 12px Inter,sans-serif;letter-spacing:.16em;text-transform:uppercase;color:var(--go2);margin:8px 0 0;animation:pl 2s ease-in-out infinite}
@keyframes pl{50%{opacity:.4}}
#sheet{position:fixed;left:0;right:0;bottom:0;max-height:82vh;overflow:auto;z-index:55;background:var(--sh);color:var(--st);border-radius:22px 22px 0 0;padding:18px 18px calc(24px + env(safe-area-inset-bottom,0px));transform:translateY(105%);transition:.4s;max-width:520px;margin:auto;box-shadow:0 -10px 40px #0007;font:14px Inter,system-ui,sans-serif}
#sheet.o{transform:none}#sheet h3{margin:14px 0 6px;font:600 19px 'Cormorant Garamond',serif}#sheet label{display:block;margin:10px 0 3px;opacity:.7;font-size:12px}
#sheet input,#sheet textarea{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--sb);background:transparent;color:var(--st);font:inherit}#sheet .g{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
#sheet .x{float:right;background:none;border:0;color:inherit;font-size:24px;cursor:pointer;min-width:44px;min-height:44px}#sheet .r{border-top:1px solid var(--sb);padding:7px 0;display:flex;justify-content:space-between;align-items:center;gap:8px}
.pb,.pk{border:1px solid var(--sb);background:transparent;color:inherit;border-radius:99px;padding:9px 14px;min-height:44px;cursor:pointer;font:inherit}.pk.on{background:#a47b2a;color:#fff;border-color:#a47b2a}.pb{width:44px;padding:9px 0}
@media(prefers-reduced-motion:reduce){.shy{animation:none}.rvl{opacity:1;transform:none;transition:none}}

.cvr .hero{min-height:calc(100svh - 92px);display:flex;flex-direction:column;justify-content:center;padding-top:190px}
.fab.e,#sheet{display:none!important}
.sw{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin-top:12px}.sw i{width:46px;height:46px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1.5px var(--go),0 3px 8px #0003}
.photos{display:flex;gap:12px;justify-content:center}.photos .photo{width:46%;margin:12px 0 0}
h1,h2,h3,p,.cap,.nm,.kd,.dt,.sm,.big,.msg{overflow-wrap:anywhere}
