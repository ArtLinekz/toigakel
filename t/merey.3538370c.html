.fp{position:fixed;left:50%;bottom:calc(8px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#fff;color:#444;font:500 10px Inter,sans-serif;padding:3px 14px;border-radius:99px;z-index:15;opacity:.9;pointer-events:none}

.rvl{opacity:0;transform:translateY(26px);transition:opacity 1.1s,transform 1.1s cubic-bezier(.2,.7,.2,1)}.rvl.in{opacity:1;transform:none}#inv.static *{animation:none!important;transition:none!important}

#sheet input,#sheet textarea{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--sb);background:transparent;color:var(--st);font:inherit}#sheet .g{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
#sheet .x{float:right;background:none;border:0;color:inherit;font-size:22px;cursor:pointer}#sheet .r{border-top:1px solid var(--sb);padding:7px 0;display:flex;justify-content:space-between;align-items:center;gap:8px}
.pb,.pk{border:1px solid var(--sb);background:transparent;color:inherit;border-radius:99px;padding:7px 13px;cursor:pointer;font:inherit}.pk.on{background:var(--mg);color:#fff;border-color:var(--mg)}.pb{width:38px;padding:7px 0}
button[onclick="sh(1)"],#sheet,.fab.e{display:none!important}

h1,h2,h3,p,.cap,.cp,.gs,.l1,.l2,.l3,.l4,.hs,.bye,.nm,.n1,.n2,.vn,.sd1,.scr,.k,.u,.dt,.tp,.arch,.rv2,.sm,.et{overflow-wrap:anywhere}

</style></head><body>
<div id="env" onclick="openEnv()"></div><div id="inv"></div><div class="fp">toigakel.kz</div>
<button class="fab m" id="mb" onclick="mus()">♪</button><button class="fab e" onclick="sh(1)">✎</button><div id="sheet"></div>
<script>
const TR=[{t:'River Flows In You',a:'Yiruma'},{t:'Аққу (күй)',a:'Нұрғиса Тілендиев'},{t:'Сен',a:'Erke Esmahan'}];
window.CFG=window.CFG||{};
const MO=['қаңтар','ақпан','наурыз','сәуір','мамыр','маусым','шілде','тамыз','қыркүйек','қазан','қараша','желтоқсан'],WD=['ДС','СС','СР','БС','ЖМ','СБ','ЖС'];
let D={age:'60',unit:'жас',kind:'Мерейтой',env:'Мерейтойға шақыру',msg:'Сіздерді анамыздың 60 жылдық мерейтойына арналған кешке шақырамыз. Бұл кеш жақындар мен туғандардың жылы жүздесуі болып, шынайы құттықтауларға, қуаныш пен жағымды естеліктерге толы болады.',hosts:'Үсен - Гүлнар',date:'2026-12-26',time:'17:00',venue:'«Алтын орда» мейрамханасы',addr:'Алматы қаласы, Абай даңғылы, 100',map:'https://2gis.kz',music:'1'},R=[];
if(CFG.D){D=Object.assign(D,CFG.D);R=CFG.R||[]}
function save(){}
const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));const pd=n=>String(n).padStart(2,'0'),$=i=>document.getElementById(i);
const SP='<svg class="dv" width="170" height="26" viewBox="0 0 170 26" fill="none" stroke="#c9a27a"><path d="M0 14H66M104 14H170"/><path d="M68 14Q85 6 102 14" stroke-width="1.4"/><g fill="#c9a27a" stroke="none"><ellipse cx="76" cy="9" rx="5" ry="2" transform="rotate(-30 76 9)"/><ellipse cx="85" cy="7" rx="5" ry="2" transform="rotate(-10 85 7)"/><ellipse cx="94" cy="9" rx="5" ry="2" transform="rotate(25 94 9)"/><ellipse cx="80" cy="18" rx="5" ry="2" transform="rotate(30 80 18)"/><ellipse cx="91" cy="18" rx="5" ry="2" transform="rotate(-25 91 18)"/></g></svg>';
function pet(n){let h='';for(let i=0;i<n;i++)h+=`<i class="pt" style="left:${(i*37+11)%96}%;animation-delay:-${(i*1.7)%10}s;animation-duration:${8+(i*3)%6}s;transform:scale(${.7+(i%4)*.2})"></i>`;return h}
function cal(){const[y,m,d]=D.date.split('-').map(Number);if(!y)return'';const f=(new Date(y,m-1,1).getDay()+6)%7,n=new Date(y,m,0).getDate();let h=WD.map(w=>`<i>${w}</i>`).join('')+'<u></u>'.repeat(f);for(let k=1;k<=n;k++)h+=`<b class="${k===d?'hl':''}">${k}</b>`;return h}
function inv(){const[y,m,d]=D.date.split('-').map(Number);
return `<section class="s hero">${pet(10)}<div class="bq b2 bl" style="top:56%;bottom:auto;left:-13%;width:42%"></div>${D.age?`<div class="n">${esc(D.age)}</div><div class="u">${esc(D.unit)}</div>`:''}<div class="k">${esc(D.kind)}</div></section>
<section class="s ps"><div class="bq tr" style="top:-31vh;width:60%;right:-15%"></div><div class="arch"><div class="cap rvl">Құрметті</div><p class="rvl">${esc(D.msg)}</p>${SP}<div class="hs rvl">Той иелері:<b>${esc(D.hosts)}</b></div></div><div class="bq bl" style="bottom:-1%"></div></section>
<section class="s wt"><div class="bq tl"></div><div class="arc" style="width:150%;height:62%;left:-30%;top:-34%"></div><div class="l1 rvl">Тойдың басталу уақыты</div><div class="l2 rvl">${y} ж. ${d} ${(MO[m-1]||'')}</div><div class="l3 rvl">${esc(D.time)}</div>${SP}<div class="l4 rvl">Той өтетін орын:<br>${esc(D.venue)}<br>${esc(D.addr)}</div><a class="mb rvl" href="${esc(D.map)}" target="_blank" rel="noopener">Картаға өту</a><div class="bq br"></div></section>
<section class="s"><div class="arc" style="width:160%;height:78%;left:-30%;top:10%"></div><div class="bq tr"></div><div class="rvl" style="position:relative;z-index:2"><div class="ct">${d} ${(MO[m-1]||'')} ${y}</div><div class="cal">${cal()}</div></div><div class="bq bl"></div></section>
<section class="s" style="justify-content:flex-start;padding-top:70px;min-height:0;padding-bottom:140px">${pet(8)}<div class="cd rvl" id="cd"><div><b>0</b><small>КҮН</small></div><div><b>0</b><small>САҒАТ</small></div><div><b>0</b><small>МИНУТ</small></div><div><b>0</b><small>СЕКУНД</small></div></div>
<div class="bq b2 bl" style="top:130px;bottom:auto;left:-15%;width:38%"></div><div class="rv2 rvl"><h2>Құрметті қонақ, тойға келетініңізді растаңыз</h2><div id="fm"><input id="nm" placeholder="Есіміңіз"><button class="bt on" data-v="Келемін" onclick="sv(this)">Келемін</button><button class="bt" data-v="Отбасыммен келемін" onclick="sv(this)">Отбасыммен келемін</button><button class="bt" data-v="Келе алмаймын" onclick="sv(this)">Өкінішке орай, келе алмаймын</button><button class="bt mg" onclick="rs()">Жауап жіберу</button></div></div></section>`}
let sel='Келемін';function sv(b){sel=b.dataset.v;document.querySelectorAll('.bt[data-v]').forEach(x=>x.classList.toggle('on',x===b))}
function rs(){const n=$('nm').value.trim();if(!n){$('nm').focus();return}{const x={n,a:sel,t:new Date().toLocaleString('kk-KZ')};R.push(x);sendR(x)}$('fm').innerHTML='<p style="font-size:20px;margin:10px 0">Рақмет, '+esc(n)+'!<br>Жауабыңыз қабылданды ✓</p>';sheet()}
function tick(){const e=$('cd');if(!e)return;let s=Math.floor((new Date(D.date+'T'+D.time)-Date.now())/1000);if(isNaN(s)||s<0)s=0;const v=[Math.floor(s/86400),pd(Math.floor(s%86400/3600)),pd(Math.floor(s%3600/60)),pd(s%60)];e.querySelectorAll('b').forEach((x,i)=>x.textContent=v[i])}
function obs(all){const io=new IntersectionObserver(es=>es.forEach(x=>{if(x.isIntersecting){x.target.classList.add('in');io.unobserve(x.target)}}),{threshold:.12});document.querySelectorAll('.rvl:not(.in)').forEach(e=>all?e.classList.add('in'):io.observe(e))}
function draw(all){$('inv').innerHTML=inv();if(CFG.cover){[...$('inv').children].slice(1).forEach(e=>e.remove());document.documentElement.style.overflow='hidden';document.body.style.overflow='hidden';document.body.classList.remove('lk');if(!document.getElementById('cvs'))document.head.insertAdjacentHTML('beforeend','<style id="cvs">.fab,.fp{display:none!important}</style>')}$('inv').classList.toggle('static',!!all);obs(all);tick();$('mb').style.display=mi()>=0?'block':'none'}
const mi=()=>/^\d{1,6}$/.test(D.music)?+D.music:-1;let au,pl=-1,pp=false;
function url(i){const x=TR[i];if(!x.u){const b=atob(x.s.split(',')[1]),u=new Uint8Array(b.length);for(let k=0;k<b.length;k++)u[k]=b.charCodeAt(k);x.u=URL.createObjectURL(new Blob([u],{type:'audio/mpeg'}))}return x.u}
function play(i){if(!TR[i]){if(au&&!au.paused)au.pause();parent.postMessage({toi:'play',i:i},'*');return}if(!au){au=new Audio();au.loop=true;au.onplay=()=>{pp=true;ui()};au.onpause=()=>{pp=false;ui()}}if(pl!==i){au.src=url(i);pl=i;au.play().catch(()=>0);return}if(au.paused)au.play().catch(()=>0);else au.pause()}
function ui(){$('mb').textContent=pp&&pl===mi()?'❚❚':'♪';if($('sheet').classList.contains('o'))sheet()}
function pv(i){play(i)}function mus(){if(mi()>=0)play(mi())}
function pick(i){D.music=i<0?'':String(i);save();if(i<0&&au)au.pause();$('mb').style.display=i<0?'none':'block';sheet()}
const FL=[['age','Жас/санды'],['unit','Жазу (жас)'],['kind','Атауы'],['env','Конверттегі жазу'],['hosts','Той иелері'],['date','Күні','date'],['time','Уақыты','time'],['venue','Мейрамхана'],['addr','Мекенжайы'],['map','2GIS сілтемесі','url']];
function sheet(){$('sheet').innerHTML=`<button class="x" onclick="sh(0)">×</button><h3 style="margin-top:0">Шақыртуды өзгерту</h3><button class="pk" onclick="sh(0);envInit()">✉ Конвертті қайта көру</button><div class="g">${FL.map(([k,l,t],i)=>`<div style="${i>6?'grid-column:1/3':''}"><label>${l}</label><input type="${t||'text'}" value="${esc(D[k])}" oninput="D['${k}']=this.value;save();draw(1)"></div>`).join('')}</div><label>Шақыру мәтіні</label><textarea rows="4" oninput="D.msg=this.value;save();draw(1)">${esc(D.msg)}</textarea>
<h3>Музыка</h3><div style="opacity:.65;margin-bottom:6px">▶ басып тыңдаңыз, содан кейін таңдаңыз</div>${TR.map((x,i)=>`<div class="r"><button class="pb" onclick="pv(${i})">${pl===i&&pp?'❚❚':'▶'}</button><span style="flex:1">${x.t}<br><small style="opacity:.65">${x.a}</small></span><button class="pk ${mi()===i?'on':''}" onclick="pick(${i})">${mi()===i?'✓ Таңдалды':'Таңдау'}</button></div>`).join('')}<div class="r"><span>Музыкасыз</span><button class="pk ${mi()<0?'on':''}" onclick="pick(-1)">${mi()<0?'✓':'Таңдау'}</button></div>
<h3>Қонақтар жауабы · ${R.length}</h3>${R.map(r=>`<div class="r"><span>${esc(r.n)}</span><span style="opacity:.7">${esc(r.a)}</span></div>`).join('')||'<div style="opacity:.6">Жауап әлі жоқ</div>'}`}
function sh(o){if(o)sheet();$('sheet').classList.toggle('o',!!o)}
let opened=false;
function envInit(){const e=$('env');e.className='';e.style.display='block';opened=false;document.body.classList.add('lk');window.scrollTo(0,0);
e.innerHTML=`<svg viewBox="0 0 100 100" preserveAspectRatio="none"><polygon class="pn p1" points="0,0 100,0 50,58" fill="#ecb6e7"/><polygon class="pn p2" points="0,0 50,58 0,100" fill="#e7a8df"/><polygon class="pn p3" points="100,0 100,100 50,58" fill="#e9ade2"/><polygon class="pn p4" points="0,100 50,58 100,100" fill="#e2a0d9"/></svg><div class="et">${esc(D.env)}</div><div class="sl">Ашу</div>`}
function openEnv(){if(opened)return;opened=true;$('env').classList.add('open');const i=mi();if(i>=0&&!(pp&&pl===i))play(i);draw(0);setTimeout(()=>{$('env').style.display='none';document.body.classList.remove('lk');window.scrollTo(0,0)},1600)}
sheet=function(){};
play=function(i){parent.postMessage({toi:'play',i:i},'*')};
window.addEventListener('message',e=>{const m=e.data;if(!m||!m.toi)return;if(m.toi==='set'){D=Object.assign(D,m.D);draw(1)}if(m.toi==='state'){pl=m.pl;pp=m.pp;ui()}});
draw(0);if(CFG.noenv){$('env').style.display='none';document.body.classList.remove('lk')}else envInit();setInterval(tick,1000);

function sendR(x){if(CFG.sa&&CFG.rid){parent.postMessage({toi:'rsvp',rid:CFG.rid,r:x},'*');return}if(CFG.sa){if(CFG.wa)(function(u){var a=document.createElement('a');a.href=u;a.target='_blank';a.rel='noopener';document.body.appendChild(a);a.click();setTimeout(function(){a.remove()},500)})('https://wa.me/'+CFG.wa+'?text='+encodeURIComponent((CFG.title?CFG.title+'\n':'')+x.n+' — '+x.a))}else parent.postMessage({toi:'rsvp',id:CFG.id,r:x},'*')}
if(CFG.sa){window.play=function(i){if(!CFG.audio)return;if(!window._au){window._au=new Audio(CFG.audio);_au.loop=true;_au.onplay=()=>{pp=true;pl=i;ui()};_au.onpause=()=>{pp=false;ui()}}if(_au.paused)_au.play().catch(()=>0);else _au.pause()};
if(!CFG.wa)document.head.insertAdjacentHTML('beforeend','<style>.rs,.rv2{display:none!important}</style>');if(!CFG.audio)document.head.insertAdjacentHTML('beforeend','<style>.fab{display:none!important}</style>')}
<\/script></body></html>
