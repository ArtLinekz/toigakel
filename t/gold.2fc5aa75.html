<!DOCTYPE html>
<html lang="kk"><head><meta charset="utf-8"><title>Той шақыруы — Gold Heart</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400;1,500&family=Forum&family=Bad+Script&family=Noto+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
:root{--go:#b3922c;--tx:#1d1a17;box-sizing:border-box;background:#111;color-scheme:light}*{box-sizing:border-box}
body{margin:0;background:#111;font-family:Forum,'Noto Serif',serif;color:var(--tx)}body.lk{overflow:hidden}
#inv{max-width:460px;margin:auto;background:#fdfbfb;overflow:hidden}
.scr{font-family:'Cormorant Garamond','Noto Serif',serif;font-style:italic;font-weight:400}.cp{text-transform:uppercase;letter-spacing:.06em;line-height:1.7;font-size:18px;margin:0 0 22px}
.hero{position:relative;height:100vh;height:100svh;min-height:520px;overflow:hidden;color:#fff;background:#222}
.hero .bg{position:absolute;inset:-24px;background:center/cover;filter:blur(16px) brightness(.8);transition:filter 1.8s,transform 2.4s;transform:scale(1.05)}.hero.op .bg{filter:brightness(.78);transform:scale(1)}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(#0006,#0000 35%,#0007)}
.hero>*{position:absolute;z-index:2}.it{left:0;right:0;top:34%;text-align:center;font-size:20px;cursor:pointer;transition:opacity .8s;z-index:3}.it svg{display:block;margin:16px auto 0;width:150px;height:150px;animation:pu 1.8s ease-in-out infinite;filter:drop-shadow(0 4px 14px #0008)}
@keyframes pu{50%{transform:scale(1.08)}}.hero.op .it{opacity:0;pointer-events:none}
.tp{left:0;right:0;top:46px;text-align:center;font-size:18px;letter-spacing:.14em;text-transform:uppercase;opacity:0;transition:opacity 1.4s .5s}
.hero>.nn{left:0;right:0;top:44%;display:flex;flex-direction:column;gap:2px;padding:0 5%;max-height:52%;overflow:hidden}.n1,.n2{position:static!important;font-size:clamp(28px,11vw,52px);line-height:1.08;text-shadow:0 2px 18px #000a;opacity:0;max-width:94%;transition:opacity 1.4s,transform 1.6s cubic-bezier(.2,.7,.2,1)}.n1{align-self:flex-end;text-align:right;transform:translateX(60px)}.n2{align-self:flex-start;text-align:left;transform:translateX(-60px)}
.hero.op .tp,.hero.op .n1,.hero.op .n2{opacity:1;transform:none}.hero.op .n1{transition-delay:.7s}.hero.op .n2{transition-delay:1.1s}
.w{padding:54px 26px 30px;text-align:center}.gs{font:italic 400 36px 'Cormorant Garamond','Noto Serif',serif;color:var(--go);margin:0 0 26px;line-height:1.2}
.col{display:grid;grid-template-columns:1fr 1fr;gap:18px;padding:10px 22px 0}.col img,.col .ph{width:100%;aspect-ratio:3/4;object-fit:cover;display:block;background:#e9e1d8}.col .c2{margin-top:36px}.col .c3{grid-column:1/3;width:70%;justify-self:center;aspect-ratio:1;margin-top:14px}
.gc{font-size:22px;font-weight:700;letter-spacing:.1em;color:var(--go);text-transform:uppercase}.sd1{font:italic 400 26px 'Cormorant Garamond','Noto Serif',serif;margin:14px 0 6px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:10px 0;max-width:300px;margin:16px auto;font-size:16px}.cal i{font-style:normal;font-size:14px}.cal b{font-weight:400;position:relative;height:28px;line-height:28px}.cal .hl svg{position:absolute;left:50%;top:50%;width:34px;height:32px;transform:translate(-50%,-50%);animation:hb 1.6s ease-in-out infinite}@keyframes hb{50%{transform:translate(-50%,-50%) scale(1.14)}}
.loc{position:relative;padding:34px 20px 40px 78px;text-align:center}.loc .vl{position:absolute;left:4px;top:0;bottom:0;width:66px;display:flex;align-items:center;justify-content:center}.loc .vl span{writing-mode:vertical-rl;transform:rotate(180deg);font-size:58px;letter-spacing:.06em;color:var(--go);font-weight:400}
.loc .vn{font:italic 400 30px 'Cormorant Garamond','Noto Serif',serif;margin:8px 0}.loc svg.ch{display:block;margin:6px auto 0}.mp{display:inline-block;margin-top:16px}.sm{font-size:13px;letter-spacing:.1em;text-transform:uppercase;margin-top:6px}
.sl{position:relative;background:#000}.trk{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}.trk::-webkit-scrollbar{display:none}.trk>div{flex:0 0 100%;scroll-snap-align:center;aspect-ratio:3/4.2;background:#111}.trk img{width:100%;height:100%;object-fit:cover;display:block}
.ar{position:absolute;top:44%;width:34px;height:34px;border-radius:50%;border:0;background:#0008;color:#fff;font-size:20px;cursor:pointer;z-index:2}.ar.l{left:10px}.ar.r{right:10px}.dts{display:flex;gap:7px;justify-content:center;padding:14px 0 16px;background:#000}.dts i{width:7px;height:7px;border-radius:50%;background:#fff5}.dts i.on{background:#fff}
.rs{padding:50px 26px 10px;text-align:center}.rs .cp{font-size:17px}.rs form{text-align:left;max-width:330px;margin:0 auto}.rs label.q{font-size:13px;letter-spacing:.06em;text-transform:uppercase;display:block;margin:4px 0 6px}
.rs input[type=text]{width:100%;border:1.5px solid #222;border-radius:99px;padding:12px 18px;font:16px Forum,'Noto Serif',serif;background:#fff;color:#111;margin-bottom:14px}
.op2{display:flex;align-items:center;gap:10px;font-size:14px;letter-spacing:.05em;text-transform:uppercase;margin:9px 0;cursor:pointer}.op2 input{width:17px;height:17px;accent-color:#111}
.bb{display:block;margin:20px auto 0;background:#111;color:#fff;border:0;border-radius:99px;padding:13px 34px;font:15px Forum,'Noto Serif',serif;letter-spacing:.1em;text-transform:uppercase;cursor:pointer}
.ly{display:block;margin:18px auto}.cd{display:flex;gap:10px;justify-content:center;margin:16px 0 8px}.cd div{position:relative;width:64px;height:64px}.cd svg{width:64px;height:64px;transform:rotate(-90deg)}.cd b{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font:500 19px/1 Forum,'Noto Serif',serif}.cd small{font-size:10px;margin-top:2px}
.gd{height:12px;margin:22px auto;max-width:300px;background:radial-gradient(circle,#e3c15a 1.3px,transparent 1.9px) 0 50%/7px 12px repeat-x;-webkit-mask-image:linear-gradient(90deg,transparent,#000 20%,#000 80%,transparent);mask-image:linear-gradient(90deg,transparent,#000 20%,#000 80%,transparent)}
.hs{font:italic 400 34px/1.25 'Cormorant Garamond','Noto Serif',serif;margin:0}.bye{font:italic 400 36px/1.3 'Cormorant Garamond','Noto Serif',serif;margin:0}
.rv{opacity:0;transform:translateY(24px);transition:opacity 1s,transform 1s cubic-bezier(.2,.7,.2,1)}.rv.in{opacity:1;transform:none}#inv.static *{animation:none!important;transition:none!important}
.fp{position:fixed;left:50%;bottom:calc(8px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#fff;color:#444;font:500 10px sans-serif;padding:3px 14px;border-radius:99px;z-index:15;opacity:.9;pointer-events:none}
.fab{position:fixed;left:14px;bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:20;width:42px;height:42px;border-radius:50%;border:0;background:#5a4a5acc;color:#fff;font-size:18px;cursor:pointer;display:none}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}
h1,h2,h3,p,.cap,.cp,.gs,.l1,.l2,.l3,.l4,.hs,.bye,.nm,.n1,.n2,.vn,.sd1,.scr,.k,.u,.dt,.tp,.arch,.rv2,.sm,.et{overflow-wrap:anywhere}
.op2,.op{min-height:44px}.bt,.bb,.mb,.b{min-height:44px}
</style></head><body class="lk">
<div id="inv"></div><div class="fp">toigakel.kz</div><button class="fab" id="mb" onclick="mus()">♪</button>
<script>
window.CFG=window.CFG||{};
const MO=['қаңтар','ақпан','наурыз','сәуір','мамыр','маусым','шілде','тамыз','қыркүйек','қазан','қараша','желтоқсан'],WD=['Дс','Сс','Ср','Бс','Жм','Сб','Жс'];
let D=Object.assign({groom:'Ерасыл',bride:'Айтолқын',kind:'Үйлену тойға шақыру',guests:'Ағайын-туыс, бауырлар, құда-жекжат, нағашы-жиен, бөлелер, әпке-жезде, құрдастар, достар, әріптестер, көршілер!',msg:'Шаңырақ көтеруіне орай жайылған ақ дастарханымыздың қадірлі қонағы болуға шақырамыз!',date:'2026-12-19',time:'17:00',hosts:'Кеңіс - Дәмеш',venue:'«Tumar hall» мейрамханасы',addr:'Гүлдала ауылы, Шыңғыстау көшесі, 2',map:'',photos:[],music:'0'},CFG.D||{});
let R=CFG.R||[],opened=!!CFG.noenv,pl=-1,pp=false,sel='Әрине келемін';
const $=i=>document.getElementById(i),esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])),pd=n=>String(n).padStart(2,'0'),mi=()=>/^\d{1,6}$/.test(D.music)?+D.music:-1;
const P=i=>{const a=D.photos||[];return a.length?a[i%a.length]:''};
const img=(i,c)=>P(i)?`<img class="${c}" src="${esc(P(i))}" alt="">`:`<div class="ph ${c}"></div>`;
const LILY='<svg class="ly" width="130" height="120" viewBox="0 0 130 120"><defs><radialGradient id="lg" cx=".5" cy=".7" r=".8"><stop offset="0" stop-color="#e9d2b4"/><stop offset="1" stop-color="#fff9f0"/></radialGradient></defs><g transform="translate(65 52)">'+[0,72,144,216,288].map(a=>`<path d="M0 0C-16 -18 -14 -44 0 -48C14 -44 16 -18 0 0Z" transform="rotate(${a})" fill="url(#lg)" stroke="#8b6a45" stroke-width=".8"/>`).join('')+'<circle r="5" fill="#7b4a1f"/><path d="M0 0L0 -20M0 0L-12 -14M0 0L12 -14" stroke="#7b4a1f" stroke-width="1.2"/></g><path d="M62 70C50 90 40 104 18 116M68 70C80 92 92 104 114 116" stroke="#4a2c14" stroke-width="5" fill="none" stroke-linecap="round"/></svg>';
function fpH(){let s='';for(let i=0;i<15;i++){const k=1-i*.062;s+=`<path d="M50 92C8 62 2 38 11 22 22 6 42 10 50 27 58 10 78 6 89 22 98 38 92 62 50 92Z" transform="translate(${50+i*.5} ${54-i*.3}) scale(${k}) translate(-50 -54)" fill="none" stroke="#fff" stroke-width="${(1.7/k).toFixed(2)}" stroke-dasharray="${60-i*2} ${3+i%4}"/>`}return `<svg viewBox="0 0 100 100">${s}</svg>`}
function cal(){const[y,m,d]=D.date.split('-').map(Number);if(!y)return'';const f=(new Date(y,m-1,1).getDay()+6)%7,n=new Date(y,m,0).getDate();let h=WD.map(w=>`<i>${w}</i>`).join('')+'<u></u>'.repeat(f);for(let k=1;k<=n;k++)h+=k===d?`<b class="hl"><svg viewBox="0 0 32 30"><path d="M16 27C4 18 2 10 8 6c4-3 7 0 8 3 1-3 4-6 8-3 6 4 4 12-8 21z" fill="none" stroke="#111" stroke-width="1.6"/></svg>${pd(k)}</b>`:`<b>${pd(k)}</b>`;return h}
function ring(){return `<circle cx="32" cy="32" r="27" fill="none" stroke="#7a3a10" stroke-width="6"/><circle class="pg" cx="32" cy="32" r="27" fill="none" stroke="#f0953a" stroke-width="6" stroke-linecap="round" stroke-dasharray="169.6" stroke-dashoffset="169.6"/>`}
function inv(){const[y,m,d]=D.date.split('-').map(Number),n=(D.photos||[]).length,sl=(n?D.photos:['']).map(p=>`<div>${p?`<img src="${esc(p)}" alt="">`:''}</div>`).join('');
return `<section class="hero ${opened?'op':''}" id="hero"><div class="bg" style="background-image:url('${esc(P(0))}')"></div><div class="it" onclick="openIntro()">Жүректі басыңыз${fpH()}</div><div class="tp">${esc(D.kind)}</div><div class="nn"><div class="n1 scr">${esc(D.groom)}</div><div class="n2 scr">${esc(D.bride)}</div></div></section>
<section class="w"><h2 class="gs rv">Құрметті қонақтар!</h2><p class="cp rv">${esc(D.guests)}</p><p class="cp rv">Сіздерді балаларымыз</p><h2 class="gs rv" style="margin-top:20px">${esc(D.groom)} мен ${esc(D.bride)}</h2><p class="cp rv">${esc(D.msg)}</p></section>
<div class="col rv">${img(1,'c1')}${img(2,'c2')}${img(3,'c3')}</div>
<section class="w"><div class="gc rv">Той салтанаты</div><div class="sd1 rv">${d} ${MO[m-1]||''} ${y||''} жыл</div><div class="cal rv">${cal()}</div><div class="sd1 rv">Басталуы ${esc(D.time)}-де</div></section>
<section class="loc"><div class="vl"><span>ЛОКАЦИЯ</span></div><p class="cp rv" style="margin-bottom:8px">Мекен жайымыз:</p><p class="cp rv" style="margin:0">${esc(D.addr)}</p><div class="vn rv">${esc(D.venue)}</div>
<a class="mp rv" ${D.map?`href="${esc(D.map)}" target="_blank" rel="noopener"`:''}><svg width="60" height="60" viewBox="0 0 64 64"><rect width="64" height="64" rx="15" fill="#3fae49"/><path d="M0 40C14 34 30 46 64 36v13a15 15 0 0 1-15 15H15A15 15 0 0 1 0 49z" fill="#f2c230"/><path d="M0 15A15 15 0 0 1 15 0h34a15 15 0 0 1 15 15v22C34 46 18 32 0 40z" fill="#1d8fe0"/><path d="M32 12a11 11 0 0 0-11 11c0 9 11 19 11 19s11-10 11-19a11 11 0 0 0-11-11z" fill="#fff"/><circle cx="32" cy="23" r="5" fill="#1d8fe0"/></svg></a>
<svg class="ch" width="30" height="26" viewBox="0 0 30 26" fill="none" stroke="#111" stroke-width="3" stroke-linecap="round"><path d="M4 12l11-9 11 9M4 23l11-9 11 9"/></svg><div class="sm">Нақты адресті көру үшін басыңыз</div></section>
<div class="sl rv"><div class="trk" id="trk" onscroll="dots()">${sl}</div><button class="ar l" onclick="slide(-1)" aria-label="Алдыңғы">‹</button><button class="ar r" onclick="slide(1)" aria-label="Келесі">›</button><div class="dts" id="dts">${(n?D.photos:['']).map((_,i)=>`<i class="${i?'':'on'}"></i>`).join('')}</div></div>
<section class="rs"><p class="cp rv">Тойға қатысуыңызды растауыңызды сұраймыз</p><p class="cp rv" style="font-size:15px">Аты-жөніңіз (жұбайыңызбен келетін болсаңыз, екеуіңіздің де есімдеріңізді жазуыңызды өтінеміз)</p>
<form id="fm" class="rv" onsubmit="return rs()"><label class="q">Есіміңіз?</label><input type="text" id="nm" autocomplete="off"><label class="op2"><input type="radio" name="a" value="Әрине келемін" checked onchange="sel=this.value">Әрине келемін</label><label class="op2"><input type="radio" name="a" value="Жұбайыммен келемін" onchange="sel=this.value">Жұбайыммен келемін</label><label class="op2"><input type="radio" name="a" value="Келе алмаймын" onchange="sel=this.value">Өкінішке орай келе алмаймын</label><button class="bb">Жауап беру</button></form>${LILY}</section>
<section class="w" style="padding-top:10px"><div class="gc rv" style="font-size:19px">Тойға дейін қалды:</div><div class="cd rv" id="cd">${['күн','сағат','минут','секунд'].map(l=>`<div><svg viewBox="0 0 64 64">${ring()}</svg><b><span>0</span><small>${l}</small></b></div>`).join('')}</div><div class="gd"></div><p class="hs rv">Той иелері:<br>${esc(D.hosts)}</p><div class="gd"></div><p class="bye rv">Келіңіздер, тойымыздың қадірлі қонағы болыңыздар!</p><div class="gd"></div><div style="height:40px"></div></section>`}
function openIntro(){if(opened)return;opened=true;$('hero').classList.add('op');document.body.classList.remove('lk');const i=mi();if(i>=0&&!(pp&&pl===i))play(i)}
function slide(k){const t=$('trk');t.scrollBy({left:k*t.clientWidth,behavior:'smooth'})}
function dots(){const t=$('trk'),i=Math.round(t.scrollLeft/t.clientWidth);document.querySelectorAll('#dts i').forEach((e,j)=>e.classList.toggle('on',j===i))}
function rs(){const n=$('nm').value.trim();if(!n){$('nm').focus();return false}const x={n,a:sel,t:new Date().toLocaleString('kk-KZ')};R.push(x);sendR(x);$('fm').outerHTML='<p class="cp" style="margin-top:20px">Рақмет, '+esc(n)+'!<br>Жауабыңыз қабылданды ✓</p>';return false}
function tick(){const e=$('cd');if(!e)return;let s=Math.floor((new Date(D.date+'T'+D.time)-Date.now())/1000);if(isNaN(s)||s<0)s=0;const v=[Math.floor(s/86400),Math.floor(s%86400/3600),Math.floor(s%3600/60),s%60],mx=[100,24,60,60];e.querySelectorAll('div').forEach((c,i)=>{c.querySelector('span').textContent=v[i];c.querySelector('.pg').style.strokeDashoffset=169.6*(1-Math.min(1,v[i]/mx[i]))})}
function obs(all){const io=new IntersectionObserver(es=>es.forEach(x=>{if(x.isIntersecting){x.target.classList.add('in');io.unobserve(x.target)}}),{threshold:.12});document.querySelectorAll('.rv:not(.in)').forEach(e=>all?e.classList.add('in'):io.observe(e))}
function draw(all){$('inv').innerHTML=inv();if(CFG.cover){[...$('inv').children].slice(1).forEach(e=>e.remove());document.documentElement.style.overflow='hidden';document.body.style.overflow='hidden';document.body.classList.remove('lk');if(!document.getElementById('cvs'))document.head.insertAdjacentHTML('beforeend','<style id="cvs">.fab,.fp{display:none!important}</style>')}$('inv').classList.toggle('static',!!all);obs(all);tick();$('mb').style.display=mi()>=0?'block':'none';if(!opened)document.body.classList.add('lk')}
function play(i){parent.postMessage({toi:'play',i:i},'*')}function mus(){if(mi()>=0)play(mi())}
function ui(){$('mb').textContent=pp&&pl===mi()?'❚❚':'♪'}
window.addEventListener('message',e=>{const m=e.data;if(!m||!m.toi)return;if(m.toi==='set'){D=Object.assign(D,m.D);draw(1)}if(m.toi==='state'){pl=m.pl;pp=m.pp;ui()}});
draw(0);if(opened)document.body.classList.remove('lk');setInterval(tick,1000);

function sendR(x){if(CFG.sa&&CFG.rid){parent.postMessage({toi:'rsvp',rid:CFG.rid,r:x},'*');return}if(CFG.sa){if(CFG.wa)(function(u){var a=document.createElement('a');a.href=u;a.target='_blank';a.rel='noopener';document.body.appendChild(a);a.click();setTimeout(function(){a.remove()},500)})('https://wa.me/'+CFG.wa+'?text='+encodeURIComponent((CFG.title?CFG.title+'\n':'')+x.n+' — '+x.a))}else parent.postMessage({toi:'rsvp',id:CFG.id,r:x},'*')}
if(CFG.sa){window.play=function(i){if(!CFG.audio)return;if(!window._au){window._au=new Audio(CFG.audio);_au.loop=true;_au.onplay=()=>{pp=true;pl=i;ui()};_au.onpause=()=>{pp=false;ui()}}if(_au.paused)_au.play().catch(()=>0);else _au.pause()};
if(!CFG.wa)document.head.insertAdjacentHTML('beforeend','<style>.rs,.rv2{display:none!important}</style>');if(!CFG.audio)document.head.insertAdjacentHTML('beforeend','<style>.fab{display:none!important}</style>')}
<\/script></body></html>
