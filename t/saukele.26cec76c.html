*{box-sizing:border-box}html,body{margin:0}
body{background:#efe6da;color:var(--ink);font:400 16px/1.7 var(--fb);-webkit-font-smoothing:antialiased;overflow-x:hidden}
body.lk{overflow:hidden;height:100vh}
#silk{position:fixed;inset:0;width:100%;height:100%;z-index:0;display:block;background:linear-gradient(160deg,#f6eee4,#e8dccb 55%,#f3e9dc)}
#fx{position:fixed;inset:0;width:100%;height:100%;z-index:40;pointer-events:none}
#inv{position:relative;z-index:2;max-width:480px;margin:0 auto;overflow:hidden}
section{position:relative;text-align:center;padding:84px 30px}
.k{font:500 11px var(--fb);letter-spacing:.34em;text-transform:uppercase;color:var(--gd)}
h2{font:500 38px/1.12 var(--fd);margin:14px 0 18px;color:var(--ink)}
p{margin:0 0 14px}
.mu{color:var(--mu)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
/* cover */
.cv{padding:0 0 70px;min-height:100svh}
.cv .sau{position:relative;height:min(118vw,560px);overflow:hidden}
.cv .sau i{position:absolute;inset:-6% 0 0;background:var(--i-sau) top center/cover no-repeat;will-change:transform;-webkit-mask:linear-gradient(#000 78%,transparent);mask:linear-gradient(#000 78%,transparent)}
.cv .kd{margin-top:-6px;position:relative}
#nmc{display:block;width:100%;height:150px;margin:6px 0 2px}
.cv .dt{font:500 14px var(--fb);letter-spacing:.42em;color:var(--ac)}
.cv .sc{margin-top:26px;font:500 10px var(--fb);letter-spacing:.32em;text-transform:uppercase;color:var(--mu)}
.cv .sc b{display:block;width:1px;height:46px;margin:10px auto 0;background:linear-gradient(var(--gd),transparent);animation:dr 2s ease-in-out infinite;transform-origin:top}
@keyframes dr{0%{transform:scaleY(0)}60%{transform:scaleY(1)}100%{transform:scaleY(1);opacity:0}}
/* greeting */
.gr{padding-top:200px}
.gr .dra{position:absolute;top:0;left:0;right:0;height:190px;background:var(--i-dra) center top/100% auto no-repeat;transform-origin:top;pointer-events:none}
.side{position:absolute;top:0;bottom:0;width:34px;background:var(--i-car) left top/34px auto repeat-y;pointer-events:none}
.side.l{left:0}.side.r{right:0;transform:scaleX(-1)}
.gr p,.gr h2{position:relative}
.split .line{overflow:hidden}
/* photo */
.ph{padding:0}
.ph .fr{position:relative;aspect-ratio:9/14;overflow:hidden;clip-path:inset(0 0 0 0)}
.ph .fr i{position:absolute;inset:-10% 0;background:var(--i-jew) center/cover no-repeat;will-change:transform}
.ph .fr img{position:absolute;inset:-10% 0;width:100%;height:120%;object-fit:cover}
/* date */
.dtw{padding:90px 30px}
.med{position:absolute;left:50%;top:50%;width:340px;height:340px;margin:-170px 0 0 -170px;background:var(--i-med) center/contain no-repeat;opacity:.18;pointer-events:none}
.big{font:500 120px/1 var(--fd);color:var(--ac);position:relative;display:inline-block}
.big svg{position:absolute;left:50%;top:50%;width:190px;height:190px;margin:-95px 0 0 -95px;overflow:visible}
.big circle{fill:none;stroke:var(--gd);stroke-width:1.2}
.mo{font:500 26px var(--fd);margin-top:6px}
.tm{font:500 13px var(--fb);letter-spacing:.3em;color:var(--mu);margin-top:6px}
/* countdown */
.cdw{padding:130px 24px;overflow:hidden;color:#fff}
.cdw .bg{position:absolute;inset:-12%;background:var(--i-shy) center/cover no-repeat;will-change:transform}
.cdw::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% 50%,#2a0a0d40,#2a0a0de0 75%)}
.cdw>*:not(.bg){position:relative;z-index:2}
.cdw .k{color:#f3dfb0}
.cd{display:flex;justify-content:center;gap:10px;margin-top:22px}
.cd div{min-width:68px;padding:14px 6px 10px;border:1px solid #f3dfb080;border-radius:14px;background:#2a0a0d4d;backdrop-filter:blur(3px)}
.cd b{display:block;font:500 34px/1 var(--fd);color:#fff}
.cd small{font:500 9.5px var(--fb);letter-spacing:.2em;text-transform:uppercase;color:#f3dfb0}
/* venue */
.vn{padding-top:40px}
.hands{position:relative;height:150px;margin:0 -30px 10px;overflow:hidden}
.hands i{position:absolute;top:0;bottom:0;width:50%;background:var(--i-hands) no-repeat;background-size:200% auto}
.hands i.l{left:0;background-position:left center}.hands i.r{right:0;background-position:right center}
.vn h3{font:500 30px/1.15 var(--fd);margin:10px 0 6px}
.bt{display:inline-flex;align-items:center;justify-content:center;min-height:50px;padding:0 30px;border-radius:99px;background:var(--ac);color:#fff;text-decoration:none;font:600 12px var(--fb);letter-spacing:.16em;text-transform:uppercase;border:0;cursor:pointer;margin-top:14px;position:relative;overflow:hidden}
.bt::after{content:"";position:absolute;top:0;bottom:0;width:40%;left:-60%;background:linear-gradient(100deg,transparent,#ffffff55,transparent);animation:sh 3.2s ease-in-out infinite}
@keyframes sh{60%,100%{left:130%}}
/* program */
.pg{list-style:none;padding:0;margin:20px auto 0;max-width:330px;text-align:left}
.pg li{display:flex;gap:18px;align-items:baseline;padding:14px 0;border-bottom:1px solid #3a1a1c1f}
.pg b{font:500 26px var(--fd);color:var(--ac);min-width:70px}
.dcs{display:flex;justify-content:center;gap:14px;margin-top:18px}
.dcs span{width:48px;height:48px;border-radius:50%;box-shadow:0 0 0 3px var(--pp),0 0 0 4px #3a1a1c33}
/* rsvp */
.rs .card{background:#fffaf5e6;border:1px solid #b8893f55;border-radius:22px;padding:26px 22px;backdrop-filter:blur(4px);text-align:left;max-width:360px;margin:0 auto}
.rs label.l,.rs .l{display:block;font:500 10.5px var(--fb);letter-spacing:.2em;text-transform:uppercase;color:var(--mu);margin:16px 0 7px}
.rs input[type=text],.rs input[type=number]{width:100%;min-height:50px;padding:10px 14px;border:1px solid #3a1a1c33;border-radius:12px;background:#fff;color:var(--ink);font:400 16px var(--fb)}
.rs .ch{display:grid;gap:8px}
.rs .ch label{display:flex;align-items:center;gap:10px;min-height:48px;padding:0 14px;border:1px solid #3a1a1c26;border-radius:12px;cursor:pointer;font-size:15px;background:#fff;transition:border-color .3s,background .3s}
.rs .ch label:has(input:checked){border-color:var(--ac);background:#9e1b260d}
.rs .ch input{accent-color:var(--ac);width:18px;height:18px}
.rs .bt{width:100%}
.ok{padding:20px;border-radius:14px;background:#b8893f22;text-align:center}
.ft{padding:70px 30px 110px}
.ft h2{color:var(--ac);font-style:italic}
.ft small{display:block;margin-top:26px;font-size:10px;letter-spacing:.24em;color:var(--mu)}
/* opener */
#op{position:fixed;inset:0;z-index:50;overflow:hidden;cursor:pointer;background:#efe6da}
#op .stage{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;perspective:1500px}
.ebox{position:relative;height:100%;aspect-ratio:443/787;max-width:100%;transform-style:preserve-3d}
.eh{position:absolute;top:0;bottom:0;width:50%;background:var(--i-env) no-repeat;background-size:200% 100%;backface-visibility:hidden;box-shadow:0 0 60px #0000001a}
.eh.l{left:0;background-position:left center;transform-origin:left center}
.eh.r{right:0;background-position:right center;transform-origin:right center}
.eseal{position:absolute;left:48.8%;top:49%;width:29.8%;aspect-ratio:1;transform:translate(-50%,-50%);background:var(--i-seal) center/contain no-repeat;border-radius:50%;z-index:3}
.eseal::after{content:"";position:absolute;inset:-6%;border-radius:50%;box-shadow:0 0 30px 8px #f1d38a;opacity:0;animation:gl 2.4s ease-in-out infinite}
@keyframes gl{50%{opacity:.85}}
#op .tx{position:absolute;left:0;right:0;top:63%;text-align:center;color:var(--ac);pointer-events:none;z-index:4}
#op .tx .k{color:var(--ac)}
#op .tx .nm{font:italic 600 clamp(44px,13vw,64px)/1.05 var(--fd);margin:8px 0 0}
#op .hint{position:absolute;left:0;right:0;bottom:calc(30px + env(safe-area-inset-bottom,0px));text-align:center;font:500 10.5px var(--fb);letter-spacing:.32em;text-transform:uppercase;color:var(--ac);z-index:4;animation:bob 2s ease-in-out infinite;pointer-events:none}
@keyframes bob{50%{transform:translateY(6px)}}
#opfx{position:absolute;inset:0;width:100%;height:100%;z-index:5;pointer-events:none}
#op.gone{display:none}
.fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:45;width:52px;height:52px;border-radius:50%;border:0;background:var(--ac);color:#fff;font-size:18px;cursor:pointer;box-shadow:0 10px 26px -8px #0007}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head>
<body class="lk">
<canvas id="silk" aria-hidden="true"></canvas>
<div id="op" role="button" tabindex="0" aria-label="Шақыруды ашу"><div class="stage"><div class="ebox"><div class="eh l"></div><div class="eh r"></div><div class="eseal"></div></div></div><div class="tx" id="optx"></div><div class="hint">Мөрді басыңыз</div><canvas id="opfx" aria-hidden="true"></canvas></div>
<main id="inv"></main>
<canvas id="fx" aria-hidden="true"></canvas>
<button class="fab" id="mb" aria-label="Музыка" onclick="play()">♪</button>

if(!(CFG.sa&&!CFG.wa))h+=`<section class="rs" id="rsvp"><div class="k">Жауап беру</div><h2 data-lines>Келетініңізді растаңыз</h2><div class="card" id="rf"><form onsubmit="return rs(this)"><label class="l" for="rn">Аты-жөніңіз</label><input id="rn" name="n" type="text" required autocomplete="name"><span class="l">Қатысуыңыз</span><div class="ch">${['Әрине келемін','Жұбайыммен келемін','Отбасыммен келемін','Келе алмаймын'].map((a,i)=>`<label><input type="radio" name="a" value="${a}" ${i?'':'checked'}>${a}</label>`).join('')}</div><label class="l" for="rc">Неше адам келеді?</label><input id="rc" name="c" type="number" min="1" max="20" value="1" inputmode="numeric"><button class="bt" type="submit">Жауап беру</button></form></div></section>`;
h+=`<section class="ft"><h2 data-lines>${esc(D.bye||'Келіңіздер, қуанышымызға ортақ болыңыздар!')}</h2><small>toigakel.kz</small></section>`;return h}

function rs(f){const n=f.n.value.trim();if(!n)return false;const a=(f.querySelector('input[name=a]:checked')||{}).value||'Әрине келемін',c=a==='Келе алмаймын'?'0':String(Math.max(1,Math.min(20,parseInt(f.c.value)||1)));sendR({n,a,t:c});
const b=f.querySelector('.bt').getBoundingClientRect();if(FX)FX.burst(b.left+b.width/2,b.top+b.height/2,120);$('rf').innerHTML=`<div class="ok">Рақмет, ${esc(n)}! Жауабыңыз қабылданды ✓</div>`;return false}
function sendR(x){if(CFG.sa&&CFG.rid){parent.postMessage({toi:'rsvp',rid:CFG.rid,r:x},'*');return}if(CFG.sa){if(CFG.wa)(function(u){var a=document.createElement('a');a.href=u;a.target='_blank';a.rel='noopener';document.body.appendChild(a);a.click();setTimeout(function(){a.remove()},500)})('https://wa.me/'+CFG.wa+'?text='+encodeURIComponent((CFG.title?CFG.title+'\n':'')+x.n+' — '+x.a+(x.t&&x.t!=='0'?' ('+x.t+' адам)':'')))}else parent.postMessage({toi:'rsvp',id:CFG.id,r:x},'*')}
function tick(){const e=$('cd'),p=dp();if(!e||!p)return;const[hh,mm]=String(D.time||'00:00').split(':').map(Number);let s=Math.max(0,Math.floor((new Date(p[0],p[1]-1,p[2],hh||0,mm||0)-new Date())/1000));const v=[Math.floor(s/86400),Math.floor(s%86400/3600),Math.floor(s%3600/60),s%60];e.querySelectorAll('b').forEach((b,i)=>b.textContent=i?pd(v[i]):v[i])}

/* ---------- scroll choreography (GSAP + ScrollTrigger + SplitText) ---------- */
let CTX=null;
function motion(){if(CTX){CTX.revert();CTX=null}if(!G||CFG.cover)return;
CTX=gsap.context(()=>{
gsap.to('.cv .sau i',{yPercent:14,scale:1.06,ease:'none',scrollTrigger:{trigger:'.cv',start:'top top',end:'bottom top',scrub:true}});
document.querySelectorAll('[data-lines]').forEach(el=>{SplitText.create(el,{type:'lines',mask:'lines',autoSplit:true,onSplit(s){return gsap.from(s.lines,{yPercent:110,duration:1.1,ease:'expo.out',stagger:.09,scrollTrigger:{trigger:el,start:'top 86%'}})}})});
gsap.fromTo('.gr .dra',{scaleY:.35,opacity:.4},{scaleY:1,opacity:1,ease:'none',scrollTrigger:{trigger:'.gr',start:'top bottom',end:'top 25%',scrub:true}});
gsap.utils.toArray('.side').forEach(s=>gsap.from(s,{xPercent:s.classList.contains('l')?-100:100,ease:'none',scrollTrigger:{trigger:s.parentNode,start:'top bottom',end:'top 40%',scrub:true}}));
gsap.fromTo('.ph .fr',{clipPath:'inset(18% 22% 18% 22% round 200px)'},{clipPath:'inset(0% 0% 0% 0% round 0px)',ease:'none',scrollTrigger:{trigger:'.ph',start:'top 90%',end:'top 15%',scrub:true}});
gsap.fromTo('.ph .fr i,.ph .fr img',{yPercent:-8,scale:1.2},{yPercent:8,scale:1,ease:'none',scrollTrigger:{trigger:'.ph',start:'top bottom',end:'bottom top',scrub:true}});
if(document.querySelector('.dtw')){gsap.to('.med',{rotate:220,ease:'none',scrollTrigger:{trigger:'.dtw',start:'top bottom',end:'bottom top',scrub:true}});
gsap.to('.big circle',{strokeDashoffset:0,duration:1.6,ease:'power2.inOut',scrollTrigger:{trigger:'.big',start:'top 80%'}});
gsap.from('.big',{scale:.6,opacity:0,duration:1.2,ease:'back.out(1.6)',scrollTrigger:{trigger:'.big',start:'top 85%'}});
gsap.from('.mo,.tm',{y:20,opacity:0,stagger:.12,duration:.9,ease:'power3.out',scrollTrigger:{trigger:'.mo',start:'top 90%'}});
gsap.fromTo('.cdw .bg',{rotate:-18,scale:1.25},{rotate:18,scale:1.05,ease:'none',scrollTrigger:{trigger:'.cdw',start:'top bottom',end:'bottom top',scrub:true}});
gsap.from('.cd div',{y:40,rotateX:-80,opacity:0,stagger:.1,duration:1,ease:'back.out(1.7)',transformPerspective:500,scrollTrigger:{trigger:'.cd',start:'top 85%'}})}
gsap.fromTo('.hands .l',{xPercent:-38},{xPercent:0,ease:'none',scrollTrigger:{trigger:'.vn',start:'top bottom',end:'top 30%',scrub:true}});
gsap.fromTo('.hands .r',{xPercent:38},{xPercent:0,ease:'none',scrollTrigger:{trigger:'.vn',start:'top bottom',end:'top 30%',scrub:true}});
gsap.utils.toArray('.pg li').forEach((li,i)=>gsap.from(li,{x:i%2?40:-40,opacity:0,duration:.9,ease:'power3.out',scrollTrigger:{trigger:li,start:'top 90%'}}));
gsap.from('.dcs span',{scale:0,stagger:.08,duration:.7,ease:'back.out(2)',scrollTrigger:{trigger:'.dcs',start:'top 90%'}});
gsap.from('.rs .card',{y:60,opacity:0,duration:1.1,ease:'power3.out',scrollTrigger:{trigger:'.rs .card',start:'top 88%'}});
gsap.utils.toArray('.k').forEach(k=>{if(k.closest('.cv'))return;gsap.from(k,{letterSpacing:'1em',opacity:0,duration:1.2,ease:'power3.out',scrollTrigger:{trigger:k,start:'top 90%'}})});
},$('inv'))}

function coverIn(){if(!G||CFG.cover){nameDust();return}
const tl=gsap.timeline();tl.from('.cv .sau',{opacity:0,y:50,scale:1.08,duration:1.6,ease:'expo.out'});
const k=document.querySelector('.cv .k');const s=SplitText.create(k,{type:'chars'});tl.from(s.chars,{opacity:0,y:12,stagger:.025,duration:.5,ease:'power2.out'},'-=1');
tl.add(()=>nameDust(),'-=.9');tl.from('.cv .dt',{opacity:0,letterSpacing:'1em',duration:1.4,ease:'power3.out'},'+=1.2').from('.cv .sc',{opacity:0,duration:.8},'-=.6')}

function draw(keep){$('inv').innerHTML=inv();tick();ui();if(document.fonts)document.fonts.ready.then(()=>{if(opened)nameDust()});if(opened){keep?nameDust():null;motion();if(window.ScrollTrigger)ScrollTrigger.refresh()}if(!opened)opTx()}
function opTx(){const t=$('optx');if(t)t.innerHTML=`<div class="k">${esc(D.env||D.kind)}</div><div class="nm">${esc(D.name)}</div>`}

/* ---------- opening: 3D envelope + gold burst ---------- */
function openOp(){if(opened)return;opened=true;if(mi()>=0)play();const o=$('op');o.style.pointerEvents='none';
const done=()=>{o.classList.add('gone');document.body.classList.remove('lk');window.scrollTo(0,0);motion();coverIn();if(window.ScrollTrigger)ScrollTrigger.refresh()};
if(!G){done();return}
const se=document.querySelector('.eseal').getBoundingClientRect();
const tl=gsap.timeline({onComplete:done});
tl.to('.eseal',{scale:1.18,duration:.25,ease:'power2.out'})
.add(()=>OFX&&OFX.burst(se.left+se.width/2,se.top+se.height/2,220))
.to('.eseal',{scale:.2,rotate:140,opacity:0,duration:.55,ease:'back.in(1.6)'})
.to('#op .tx,#op .hint',{opacity:0,y:-20,duration:.4},'<')
.to('.eh.l',{rotateY:-112,duration:1.7,ease:'power3.inOut'},'-=.15')
.to('.eh.r',{rotateY:112,duration:1.7,ease:'power3.inOut'},'<')
.to('.ebox',{scale:1.25,duration:1.9,ease:'power2.inOut'},'<')
.to('#op',{backgroundColor:'rgba(239,230,218,0)',duration:1.2},'-=1.3')
.to('.eh',{opacity:0,duration:.5},'-=.5')}
function opIdle(){if(!G)return;gsap.from('.ebox',{rotateX:18,y:40,opacity:0,duration:1.6,ease:'expo.out'});gsap.from('#op .tx>*',{opacity:0,y:16,stagger:.15,duration:1,delay:.5,ease:'power3.out'});gsap.to('.ebox',{rotateY:4,rotateX:-3,duration:3.5,ease:'sine.inOut',yoyo:true,repeat:-1,delay:1.6});
addEventListener('pointermove',e=>{if(opened)return;gsap.to('.ebox',{rotateY:(e.clientX/innerWidth-.5)*14,rotateX:-(e.clientY/innerHeight-.5)*10,duration:.8,overwrite:'auto'})},{passive:true})}

/* ---------- music & messages ---------- */
function ui(){const b=$('mb');if(!b)return;b.style.display=(mi()<0||(CFG.sa&&!CFG.audio))?'none':'';b.textContent=pp&&(CFG.sa||pl===mi())?'❚❚':'♪'}
function play(){if(CFG.sa){if(!CFG.audio)return;if(!window._au){window._au=new Audio(CFG.audio);_au.loop=true;_au.onplay=()=>{pp=true;ui()};_au.onpause=()=>{pp=false;ui()}}if(_au.paused)_au.play().catch(()=>0);else _au.pause();return}if(mi()>=0)parent.postMessage({toi:'play',i:mi()},'*')}
window.addEventListener('message',e=>{const m=e.data;if(!m||!m.toi)return;if(m.toi==='set'){D=Object.assign(D,m.D);draw(1)}if(m.toi==='state'){pl=m.pl;pp=m.pp;ui()}});

FX=fxLayer($('fx'));OFX=fxLayer($('opfx'));
silk();draw(0);trail();setInterval(tick,1000);
if(opened){$('op').classList.add('gone');document.body.classList.remove('lk');motion();coverIn()}
else{$('op').addEventListener('click',openOp);$('op').addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();openOp()}});if(!CFG.cover)opIdle()}
<\/script></body></html>
