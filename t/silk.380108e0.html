.st{padding:54px 26px;text-align:center}.st h2{margin:0 0 6px;font-size:36px;color:var(--tx)}
.go{color:var(--go)}.big{font-size:34px;margin:14px 0}
.ph{display:block;width:100%;height:auto;aspect-ratio:3/4;object-fit:cover;background:center/cover}.ph.t{aspect-ratio:3/4}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:8px 0;max-width:300px;margin:18px auto;font-size:15px}

<section class="sk rs"><div class="cap rv">Тойға келуіңізді растауыңызды сұраймыз</div><div class="cap rv" style="margin-top:18px;font-size:16px">Аты-жөніңіз (жұбайыңызбен келетін болсаңыз, екеуіңіздің де есімдеріңізді жазуыңызды өтінеміз)</div>
<form class="rv" onsubmit="return rs(this)" id="fm"><label>Есіміңіз</label><input type="text" name="n" required><label>Қатысуыңыз?</label><label class="op"><input type="radio" name="a" value="Әрине келемін" checked>Әрине келемін</label><label class="op"><input type="radio" name="a" value="Жұбайыммен келемін">Жұбайыммен келемін</label><label class="op"><input type="radio" name="a" value="Келе алмаймын">Өкінішке орай келе алмаймын</label><button>Жауап беру</button></form>
<div class="cap rv" style="margin-top:46px">Келіңіздер, қуанышымызға ортақ болыңыздар!</div></section>`}
function rs(f){const n=f.n.value.trim();if(!n)return false;{const x={n,a:f.a.value,t:new Date().toLocaleString('kk-KZ')};R.push(x);sendR(x)}f.outerHTML='<div class="cap" style="margin-top:24px">Рақмет, '+esc(n)+'! Жауабыңыз қабылданды ✓</div>';sheet();return false}
function tick(){const e=$('cd');if(!e)return;let s=Math.floor((new Date(D.date+'T'+D.time)-Date.now())/1000);if(isNaN(s)||s<0)s=0;const v=[Math.floor(s/86400),pd(Math.floor(s%86400/3600)),pd(Math.floor(s%3600/60)),pd(s%60)];e.querySelectorAll('div span').forEach((x,i)=>x.textContent=v[i])}
function obs(all){const io=new IntersectionObserver(es=>es.forEach(x=>{if(x.isIntersecting){x.target.classList.add('in');io.unobserve(x.target)}}),{threshold:.12});document.querySelectorAll('.rv:not(.in)').forEach(e=>all?e.classList.add('in'):io.observe(e))}
function draw(all){$('inv').innerHTML=inv();if(CFG.cover){[...$('inv').children].slice(1).forEach(e=>e.remove());document.documentElement.style.overflow='hidden';document.body.style.overflow='hidden';document.body.classList.remove('lk');if(!document.getElementById('cvs'))document.head.insertAdjacentHTML('beforeend','<style id="cvs">.fab,.fp{display:none!important}</style>')}$('inv').classList.toggle('static',!!all);obs(all);tick();paintSw();$('mb').style.display=mi()>=0?'block':'none'}
const FL=[['groom','Күйеу жігіт'],['bride','Қалыңдық'],['date','Күні','date'],['time','Уақыты','time'],['hosts','Той иелері'],['venue','Мейрамхана'],['addr','Мекенжайы'],['map','2GIS сілтемесі','url']];
function sheet(){$('sheet').innerHTML=`<button class="x" onclick="sh(0)">×</button><h3>Шақыртуды өзгерту</h3><button class="pk" onclick="sh(0);envInit()">✉ Конвертті қайта көру</button><div class="g">${FL.map(([k,l,t])=>`<div style="${k=='venue'||k=='addr'||k=='map'||k=='music'?'grid-column:1/3':''}"><label>${l}</label><input type="${t||'text'}" value="${esc(D[k])}" oninput="D['${k}']=this.value;save();draw(1)"></div>`).join('')}</div>${dcUI()}<h3 style="margin-top:18px">Музыка</h3><div style="opacity:.65;margin-bottom:6px">▶ басып тыңдаңыз, содан кейін таңдаңыз</div>${TR.map((x,i)=>`<div class="r" style="align-items:center;gap:8px"><button class="pb" onclick="pv(${i})">${pl===i&&pp?'❚❚':'▶'}</button><span style="flex:1">${x.t}<br><small style="opacity:.65">${x.a}</small></span><button class="pk ${mi()===i?'on':''}" onclick="pick(${i})">${mi()===i?'✓ Таңдалды':'Таңдау'}</button></div>`).join('')}<div class="r"><span>Музыкасыз</span><button class="pk ${mi()<0?'on':''}" onclick="pick(-1)">${mi()<0?'✓':'Таңдау'}</button></div><label>Фото 1 ${D.photo?'· өзіңіздің фото':'· бастапқы'}</label><input type="file" accept="image/*" onchange="ph(this,'photo')">${D.photo?`<button class="pk" style="margin-top:6px" onclick="rp('photo')">Бастапқы фотоға қайту</button>`:''}<label>Фото 2 ${D.photo2?'· өзіңіздің фото':'· бастапқы'}</label><input type="file" accept="image/*" onchange="ph(this,'photo2')">${D.photo2?`<button class="pk" style="margin-top:6px" onclick="rp('photo2')">Бастапқы фотоға қайту</button>`:''}<h3 style="margin-top:18px">Қонақтар жауабы · ${R.length}</h3>${R.map(r=>`<div class="r"><span>${esc(r.n)}</span><span style="opacity:.7">${esc(r.a)}</span></div>`).join('')||'<div style="opacity:.6">Жауап әлі жоқ</div>'}`}
function sh(o){if(o)sheet();$('sheet').classList.toggle('o',!!o)}
function ph(i,k){const f=i.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const s=Math.min(1,1000/im.width),c=document.createElement('canvas');c.width=im.width*s;c.height=im.height*s;c.getContext('2d').drawImage(im,0,0,c.width,c.height);D[k]=c.toDataURL('image/jpeg',.82);save();sheet();draw(1)};im.src=r.result};r.readAsDataURL(f)}
function rp(k){D[k]='';save();sheet();draw(1)}
const mi=()=>/^\d{1,6}$/.test(D.music)?+D.music:-1;let au,pl=-1,pp=false;
function url(i){const x=TR[i];if(!x.u){const b=atob(x.s.split(',')[1]),u=new Uint8Array(b.length);for(let k=0;k<b.length;k++)u[k]=b.charCodeAt(k);x.u=URL.createObjectURL(new Blob([u],{type:'audio/mpeg'}))}return x.u}
function play(i){if(!TR[i]){if(au&&!au.paused)au.pause();parent.postMessage({toi:'play',i:i},'*');return}if(!au){au=new Audio();au.loop=true;au.onplay=()=>{pp=true;ui()};au.onpause=()=>{pp=false;ui()}}if(pl!==i){au.src=url(i);pl=i;au.play().catch(()=>0);return}if(au.paused)au.play().catch(()=>alert('Музыка ашылмады'));else au.pause()}
function ui(){$('mb').textContent=pp&&pl===mi()?'❚❚':'♪';if($('sheet').classList.contains('o'))sheet()}
function pv(i){play(i)}function mus(){if(mi()>=0)play(mi())}
function pick(i){D.music=i<0?'':String(i);save();if(i<0&&au)au.pause();$('mb').style.display=i<0?'none':'block';sheet()}
let opened=false,TXD=null;const SWC={};
function envInit(){const g=esc(D.groom),b=esc(D.bride),[y,m,d]=D.date.split('-').map(Number),ds=y?`${d} ${MO[m-1]} ${y}`:'';const e=$('env');e.className='';e.style.display='flex';opened=false;document.body.classList.add('lk');
e.innerHTML=`<div class="scr" style="font-size:46px;text-align:center;line-height:1.1;text-shadow:0 2px 16px #000a">${g} &amp; ${b}</div><div class="ev" id="ev"><div class="bk"></div><div class="fp"></div><div class="lt"><div class="scr" style="font-size:28px">${g} &amp; ${b}</div><div class="cap" style="font-size:12px;margin-top:8px">Той шақыруы</div><div class="cy" style="margin-top:10px;font-size:16px">${ds}</div></div><div class="ft"></div><div class="sl">${esc((D.groom||'')[0])}&amp;${esc((D.bride||'')[0])}</div></div><div class="cap eh">Ашу үшін басыңыз</div>`}
function openEnv(){if(opened)return;opened=true;$('ev').classList.add('open');const i=mi();if(i>=0&&!(pp&&pl===i))play(i);setTimeout(()=>draw(0),1900);setTimeout(()=>$('env').classList.add('gone'),2100);setTimeout(()=>{$('env').style.display='none';document.body.classList.remove('lk');window.scrollTo(0,0)},3400)}
function ldTX(){Promise.all(A.TX.map(s=>new Promise(r=>{const im=new Image();im.onload=()=>{const c=document.createElement('canvas');c.width=im.width;c.height=im.height;const x=c.getContext('2d');x.drawImage(im,0,0);r(x.getImageData(0,0,c.width,c.height))};im.src=s}))).then(d=>{TXD=d;paintSw()})}
const hx=h=>[1,3,5].map(i=>parseInt(h.substr(i,2),16)||0);
function paintSw(){if(!TXD)return;document.querySelectorAll('.sw div[data-c]').forEach(e=>{const k=e.dataset.c+e.dataset.t;if(!SWC[k]){const c=hx(e.dataset.c),S=[c.map(v=>v*.38),c.map(v=>v*.7),c,c.map(v=>v+(255-v)*.38),c.map(v=>v+(255-v)*.7)],L=[];for(let i=0;i<256;i++){const f=i/255*4,j=Math.min(3,Math.floor(f)),u=f-j;L.push(S[j].map((v,q)=>v+(S[j+1][q]-v)*u))}
const T=TXD[+e.dataset.t],cv=document.createElement('canvas');cv.width=T.width;cv.height=T.height;const x=cv.getContext('2d'),o=x.createImageData(T.width,T.height);for(let p=0;p<T.data.length;p+=4){const l=L[T.data[p]];o.data[p]=l[0];o.data[p+1]=l[1];o.data[p+2]=l[2];o.data[p+3]=255}x.putImageData(o,0,0);SWC[k]=cv.toDataURL('image/jpeg',.85)}e.style.backgroundImage=`url(${SWC[k]})`})}
const PRE=['#56603f','#cdb08c','#1c1c20','#96593a','#a5af94','#5a3428','#7a2e3a','#2f4a6b'];
function dcUI(){return `<h3 style="margin-top:18px">Дресс-код · ${D.dc.length}</h3>${D.dc.map((c,i)=>`<div class="r" style="align-items:center;gap:8px"><input type="color" value="${c}" style="width:46px;height:36px;padding:2px;flex:none" oninput="D.dc[${i}]=this.value;save();draw(1)"><span style="flex:1;opacity:.7">${c.toUpperCase()}</span><button class="pb" onclick="dcm(${i},-1)">↑</button><button class="pb" onclick="dcm(${i},1)">↓</button><button class="pb" onclick="dcd(${i})">×</button></div>`).join('')}${D.dc.length?'':'<div style="opacity:.6;margin:6px 0">Дресс-код бөлімі шақыруда көрінбейді</div>'}<div style="display:flex;gap:8px;margin-top:8px"><button class="pk" onclick="dca()" ${D.dc.length>=8?'disabled':''}>+ Түс қосу</button>${D.dc.length?'<button class="pk" onclick="D.dc=[];dcu()">Бәрін өшіру</button>':''}</div>`}
function dcu(){save();sheet();draw(1)}
function dcm(i,d){const j=i+d;if(j<0||j>=D.dc.length)return;[D.dc[i],D.dc[j]]=[D.dc[j],D.dc[i]];dcu()}
function dcd(i){D.dc.splice(i,1);dcu()}function dca(){D.dc.push(PRE[D.dc.length%PRE.length]);dcu()}
sheet=function(){};
play=function(i){parent.postMessage({toi:'play',i:i},'*')};
window.addEventListener('message',e=>{const m=e.data;if(!m||!m.toi)return;if(m.toi==='set'){D=Object.assign(D,m.D);draw(1)}if(m.toi==='state'){pl=m.pl;pp=m.pp;ui()}});
draw(0);if(CFG.noenv){$('env').style.display='none';document.body.classList.remove('lk')}else envInit();ldTX();setInterval(tick,1000);

function sendR(x){if(CFG.sa&&CFG.rid){parent.postMessage({toi:'rsvp',rid:CFG.rid,r:x},'*');return}if(CFG.sa){if(CFG.wa)(function(u){var a=document.createElement('a');a.href=u;a.target='_blank';a.rel='noopener';document.body.appendChild(a);a.click();setTimeout(function(){a.remove()},500)})('https://wa.me/'+CFG.wa+'?text='+encodeURIComponent((CFG.title?CFG.title+'\n':'')+x.n+' — '+x.a))}else parent.postMessage({toi:'rsvp',id:CFG.id,r:x},'*')}
if(CFG.sa){window.play=function(i){if(!CFG.audio)return;if(!window._au){window._au=new Audio(CFG.audio);_au.loop=true;_au.onplay=()=>{pp=true;pl=i;ui()};_au.onpause=()=>{pp=false;ui()}}if(_au.paused)_au.play().catch(()=>0);else _au.pause()};
if(!CFG.wa)document.head.insertAdjacentHTML('beforeend','<style>.rs,.rv2{display:none!important}</style>');if(!CFG.audio)document.head.insertAdjacentHTML('beforeend','<style>.fab{display:none!important}</style>')}
<\/script></body></html>
