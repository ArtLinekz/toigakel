:root{--ink:#eef0f3;--ink2:#cdd3dc;--gold:#e8c38a;--gold2:#c99a5b;--night:#070b16;--fd:'Cormorant',Georgia,serif;--fb:'Literata',Georgia,serif;color-scheme:dark}
*{box-sizing:border-box;margin:0;padding:0}
html{background:var(--night);-webkit-text-size-adjust:100%}
body{font:400 17px/1.65 var(--fb);color:var(--ink);background:var(--night);overflow-x:hidden}
body.lk{overflow:hidden;height:100svh}
::selection{background:var(--gold);color:var(--night)}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
html{scrollbar-width:thin;scrollbar-color:var(--gold2) var(--night)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
#sky{position:fixed;inset:0;width:100%;height:100%;display:block;z-index:0;background:linear-gradient(#0b1530,#1b2546 45%,#05080f 62%)}
.scrim{position:fixed;inset:0;z-index:1;pointer-events:none;background:linear-gradient(to bottom,rgba(5,8,15,0) 0%,rgba(5,8,15,0) 52%,rgba(5,8,15,.38) 72%,rgba(5,8,15,.72) 100%)}
main{position:relative;z-index:2}

/* opening */
#op{position:fixed;inset:0;z-index:5;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;padding:0 28px calc(64px + env(safe-area-inset-bottom,0px));text-align:center;touch-action:manipulation}
#op.gone{display:none}
#op .who{font:300 italic 22px/1.3 var(--fd);color:var(--ink2);margin-bottom:26px;max-width:22ch}
.dawn{position:relative;width:86px;height:86px;border-radius:50%;border:1px solid rgba(232,195,138,.7);background:rgba(7,11,22,.35);color:var(--gold);cursor:pointer;display:grid;place-items:center}
.dawn::before{content:"";position:absolute;inset:-9px;border-radius:50%;border:1px solid rgba(232,195,138,.25);animation:br 3.2s ease-in-out infinite}
@keyframes br{50%{transform:scale(1.08);opacity:.35}}
.dawn svg{width:40px;height:40px}
#op p.h{margin-top:16px;font:500 15px/1.4 var(--fb);color:var(--ink);letter-spacing:.01em}

/* panels */
.pn{min-height:100svh;display:flex;flex-direction:column;justify-content:flex-end;padding:0 26px calc(72px + env(safe-area-inset-bottom,0px));max-width:560px;margin:0 auto}
.pn.hero{justify-content:flex-end;padding-bottom:calc(96px + env(safe-area-inset-bottom,0px));text-align:center}
.nm{font:300 clamp(54px,17vw,92px)/.92 var(--fd);letter-spacing:-.01em;color:#fff;text-shadow:0 2px 30px rgba(5,8,15,.45)}
.nm .amp{display:block;font-style:italic;font-weight:400;font-size:.46em;color:var(--gold);margin:.12em 0 .06em}
.nm .ch{display:inline-block}
.sub{margin-top:20px;font:400 italic 21px/1.35 var(--fd);color:var(--ink)}
.orn{display:block;width:120px;height:34px;margin:22px auto 0;color:var(--gold);overflow:visible}
.orn path{fill:none;stroke:currentColor;stroke-width:1.3;stroke-linecap:round}
.dl{margin-top:14px;font:500 15px/1 var(--fb);letter-spacing:.14em;color:var(--gold);font-variant-numeric:lining-nums}
h1,h2{text-wrap:balance}
.hd{font:500 italic clamp(34px,10vw,46px)/1.05 var(--fd);color:#fff;margin-bottom:16px;text-shadow:0 2px 24px rgba(5,8,15,.5)}
.p{font-size:17.5px;line-height:1.66;color:var(--ink);max-width:34ch;text-shadow:0 1px 14px rgba(5,8,15,.65)}
.mu{color:var(--ink2)}
.date{display:flex;align-items:flex-end;gap:16px}
.date .d{font:300 clamp(110px,34vw,170px)/1 var(--fd);color:#fff;letter-spacing:-.03em;font-variant-numeric:lining-nums tabular-nums}
.date .m{padding-bottom:10px;font:400 22px/1.3 var(--fd);color:var(--ink)}
.date .m b{display:block;font-weight:500;font-style:italic;color:var(--gold)}
.tm{margin-top:18px;font:500 16px/1 var(--fb);letter-spacing:.12em;color:var(--gold)}
.cnt{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;border-top:1px solid rgba(232,195,138,.35);border-bottom:1px solid rgba(232,195,138,.35);padding:16px 0}
.cnt div{text-align:center}
.cnt b{display:block;font:300 44px/1 var(--fd);color:#fff;font-variant-numeric:lining-nums tabular-nums}
.cnt small{display:block;margin-top:6px;font-size:13px;color:var(--ink2)}
.vn{font:500 26px/1.2 var(--fd);color:#fff}
.btn{display:inline-flex;align-items:center;gap:10px;margin-top:22px;padding:14px 22px;border:1px solid var(--gold);border-radius:999px;color:var(--gold);font:500 15px/1 var(--fb);text-decoration:none;background:rgba(7,11,22,.35);cursor:pointer;transition:background .25s,color .25s}
.btn:hover,.btn:active{background:var(--gold);color:var(--night)}
.btn svg{width:18px;height:18px}
.pg{list-style:none}
.pg li{display:grid;grid-template-columns:70px 1fr;gap:14px;padding:12px 0;border-bottom:1px solid rgba(238,240,243,.14)}
.pg b{font:500 17px/1.4 var(--fb);color:var(--gold);font-variant-numeric:tabular-nums}
.pg span{font-size:17px;line-height:1.45}
.dcs{display:flex;gap:16px;margin:8px 0 0}
.dcs i{width:60px;height:60px;border-radius:50%;box-shadow:0 0 0 3px rgba(7,11,22,.6),0 0 0 4px rgba(232,195,138,.75),0 10px 24px -8px rgba(0,0,0,.7)}
.hs{font:400 italic 32px/1.25 var(--fd);color:#fff}
.hs span{display:block}
#rsvp{justify-content:flex-start;padding-top:calc(84px + env(safe-area-inset-top,0px));background:linear-gradient(to bottom,rgba(5,8,15,0),rgba(5,8,15,.55) 30%,rgba(5,8,15,.55) 85%,rgba(5,8,15,0))}
.rcw[hidden]{display:none}
.wm{display:inline-block;overflow:hidden;vertical-align:top;padding-bottom:.08em}.wm>span{display:inline-block}
.rf label.t{display:block;font-size:14px;color:var(--ink2);margin:20px 0 8px}
.rf input[type=text],.rf input[type=number]{width:100%;font:400 19px/1.3 var(--fb);color:#fff;background:transparent;border:0;border-bottom:1px solid rgba(238,240,243,.5);padding:8px 2px;border-radius:0;outline:0;caret-color:var(--gold)}
.rf input:focus{border-bottom-color:var(--gold)}
.rf input::placeholder{color:#7f8796}
.ch{display:grid;gap:2px;margin-top:4px}
.ch label{display:flex;align-items:center;gap:14px;padding:10px 0;font-size:17px;cursor:pointer}
.ch input{position:absolute;opacity:0;width:1px;height:1px}
.ch .o{width:22px;height:22px;flex:none;border-radius:50%;border:1px solid rgba(238,240,243,.7);display:grid;place-items:center;transition:border-color .2s}
.ch .o::after{content:"";width:10px;height:10px;border-radius:50%;background:var(--gold);transform:scale(0);transition:transform .25s cubic-bezier(.2,.8,.2,1)}
.ch input:checked+.o{border-color:var(--gold)}
.ch input:checked+.o::after{transform:scale(1)}
.ch input:focus-visible+.o{outline:2px solid var(--gold);outline-offset:3px}
.send{margin-top:26px;width:100%;padding:17px;border:0;border-radius:999px;background:var(--gold);color:var(--night);font:500 17px/1 var(--fb);cursor:pointer}
.send[disabled]{opacity:.6}
.err{min-height:20px;margin-top:10px;font-size:14px;color:#ffb4a2}
.ok{padding:20px 0;font:400 italic 34px/1.15 var(--fd);color:#fff}
.ok small{display:block;margin-top:8px;font:400 16px/1.5 var(--fb);color:var(--ink)}
.end{text-align:center}
.end .hd{max-width:16ch;margin:0 auto 10px}
.demo{margin-top:22px;font-size:12.5px;color:var(--ink2);opacity:.75}
.mb{position:fixed;right:16px;top:calc(16px + env(safe-area-inset-top,0px));z-index:6;width:46px;height:46px;border-radius:50%;border:1px solid rgba(232,195,138,.6);background:rgba(7,11,22,.45);color:var(--gold);display:grid;place-items:center;cursor:pointer}
.mb svg{width:20px;height:20px}
.mb.on svg .w{animation:wv 1.1s ease-in-out infinite}
@keyframes wv{50%{opacity:.25}}
body.lk .mb{display:none}
@media (min-width:700px){.pn{padding-left:40px;padding-right:40px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head>

<script>
window.CFG=window.CFG||{};
const DEFS={"date": "2027-06-19", "time": "18:00", "venue": "«Алатау» той сарайы", "addr": "Алматы қаласы, Абай даңғылы, 100", "map": "https://2gis.kz/almaty", "wa": "", "photo": "", "prog": "17:30 — Қонақтарды қарсы алу\n18:00 — Беташар\n19:00 — Той салтанаты\n22:00 — Торт және алғашқы би", "dc": ["#f1e8da", "#1d2b4a", "#c9a46a"], "hosts": "Серік пен Гүлнар, Бауыржан мен Әлия", "music": "2", "groom": "Ерлан", "bride": "Айдана", "kind": "Үйлену тойына шақыру", "env": "Жаңа таң, жаңа шаңырақ", "msg": "Қымбатты ағайын, дос-жаран! Тау етегінде атқан әр таң бізге бір-бірімізді сыйлады. Енді шаңырағымыздың алғашқы таңын сіздермен бірге қарсы алғымыз келеді. Үйлену тойымызға келіп, ақ батаңызды беріңіз.", "bye": "Жұлдызды түнде, тойда кездескенше!"};
let D=Object.assign(JSON.parse(JSON.stringify(DEFS)),CFG.D||{}),opened=!!CFG.noenv&&!CFG.cover,pl=-1,pp=false;
const $=i=>document.getElementById(i),esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),pd=n=>String(n).padStart(2,'0');
const MOD=['қаңтарға','ақпанға','наурызға','сәуірге','мамырға','маусымға','шілдеге','тамызға','қыркүйекке','қазанға','қарашаға','желтоқсанға'];const MO=['қаңтар','ақпан','наурыз','сәуір','мамыр','маусым','шілде','тамыз','қыркүйек','қазан','қараша','желтоқсан'],WD=['дүйсенбі','сейсенбі','сәрсенбі','бейсенбі','жұма','сенбі','жексенбі'];
const RED=matchMedia('(prefers-reduced-motion: reduce)').matches,G=window.gsap&&!RED;if(window.gsap)gsap.ticker.lagSmoothing(0);
const safeU=u=>/^https:\/\//i.test(String(u||'').trim())?String(u).trim():'';
const mi=()=>/^\d{1,6}$/.test(D.music)?+D.music:-1;
const dp=()=>{const p=String(D.date||'').split('-').map(Number);return p.length===3&&p[0]?p:null};
const nb=s=>esc(s).replace(/(\S)-(\S)/g,'$1‑$2');

/* ---------- the sky ---------- */
const cv=$('sky');let SC=null;try{SC=window.Scene&&Scene(cv,{scale:CFG.cover?.45:(innerWidth>700?.5:.6),keep:!!CFG.cover})}catch(e){SC=null}
const W={T:opened?.25:.04,P:0,Y:1,dirty:true};
let last=0,lastAnim=0;
function frame(t){if(SC&&!document.hidden){const anim=t-lastAnim>140;if(W.dirty||anim){SC.st.T=W.T;SC.st.P=W.P;SC.st.Y=W.Y;SC.st.M=t/1000;SC.render();W.dirty=false;lastAnim=t}}if(!CFG.cover)requestAnimationFrame(frame)}
if(SC){addEventListener('resize',()=>{SC.resize();W.dirty=true});requestAnimationFrame(frame)}
function setT(v){W.T=v;W.dirty=true}
if(CFG.cover&&SC){SC.st.T=.27;SC.render();try{const u=cv.toDataURL('image/jpeg',.82);cv.style.background=`url(${u}) center/cover`;const x=SC.gl.getExtension('WEBGL_lose_context');x&&x.loseContext()}catch(e){}}

/* ---------- page ---------- */
const ORN='<svg class="orn" viewBox="0 0 120 34" aria-hidden="true"><path pathLength="1" d="M60 30C60 18 52 8 42 8C33 8 29 16 33 22C36 27 44 25 43 19C42 15 37 15 37 19"/><path pathLength="1" d="M60 30C60 18 68 8 78 8C87 8 91 16 87 22C84 27 76 25 77 19C78 15 83 15 83 19"/><path pathLength="1" d="M8 30H48M72 30H112"/></svg>';
const letters=s=>[...String(s)].map(c=>c===' '?' ':`<span class="ch">${esc(c)}</span>`).join('');
function inv(){const p=dp(),map=safeU(D.map),prog=String(D.prog||'').split('\n').map(s=>s.trim()).filter(Boolean),dc=Array.isArray(D.dc)?D.dc.filter(c=>/^#[0-9a-f]{3,8}$/i.test(c)):[];
const dt=p?new Date(p[0],p[1]-1,p[2]):null,wd=dt?(dt.getDay()+6)%7:0;
let h=`<section class="pn hero" id="hero"><h1 class="nm" aria-label="${esc(D.groom)} және ${esc(D.bride)}"><span class="g">${letters(D.groom)}</span><span class="amp">және</span><span class="b">${letters(D.bride)}</span></h1>${ORN}<p class="sub">үйлену тойына шақырады</p>${p?`<p class="dl">${pd(p[2])} · ${pd(p[1])} · ${p[0]}</p>`:''}</section>`;
h+=`<section class="pn" data-m="greet"><h2 class="hd">${esc(CFG.guest?('Құрметті '+CFG.guest+'!'):(D.env||'Жаңа таң, жаңа шаңырақ'))}</h2><p class="p">${nb(D.msg)}</p></section>`;
if(p){h+=`<section class="pn" data-m="date"><h2 class="hd">Тойымыз</h2><div class="date"><span class="d">${p[2]}</span><span class="m">${MO[p[1]-1]}<br>${p[0]}<b>${WD[wd]}</b></span></div><p class="tm">САҒАТ ${esc(D.time)}</p></section>`;
h+=`<section class="pn" data-m="cd"><h2 class="hd">Тойға дейін</h2><div class="cnt" id="cd"><div><b>0</b><small>күн</small></div><div><b>00</b><small>сағат</small></div><div><b>00</b><small>минут</small></div><div><b>00</b><small>секунд</small></div></div></section>`}
h+=`<section class="pn"><h2 class="hd">Той өтетін жер</h2><p class="vn">${esc(D.venue)}</p><p class="mu" style="margin-top:6px">${esc(D.addr)}</p>${map?`<a class="btn" href="${esc(map)}" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-6.5-5.6-6.5-11a6.5 6.5 0 0113 0c0 5.4-6.5 11-6.5 11z"/><circle cx="12" cy="10" r="2.3"/></svg>Картадан ашу</a>`:''}</section>`;
if(prog.length)h+=`<section class="pn" data-m="pg"><h2 class="hd">Кештің барысы</h2><ul class="pg">${prog.map(l=>{const m=l.match(/^(\d{1,2}[:.]\d{2})\s*[—–-]?\s*(.*)$/);return `<li><b>${m?esc(m[1]):''}</b><span>${esc(m?m[2]:l)}</span></li>`}).join('')}</ul></section>`;
if(dc.length)h+=`<section class="pn" data-m="dc"><h2 class="hd">Дресс-код</h2><p class="p mu" style="margin-bottom:14px">Осы түстер күн батқандағы кешке жарасады.</p><div class="dcs">${dc.map(c=>`<i style="background:${c}"></i>`).join('')}</div></section>`;
if(D.hosts)h+=`<section class="pn"><h2 class="hd">Той иелері</h2><p class="hs">${String(D.hosts).split(',').map(x=>`<span>${nb(x.trim())}</span>`).join('')}</p></section>`;
if(!(CFG.sa&&!CFG.wa))h+=`<section class="pn" id="rsvp"><h2 class="hd">Келесіз бе?</h2><p class="p mu">${p?'Жауабыңызды '+(x=>x.getDate()+' '+MOD[x.getMonth()])(new Date(p[0],p[1]-1,p[2]-7))+' дейін жіберсеңіз, орныңызды дайындаймыз.':'Жауабыңызды алдын ала жіберіңіз.'}</p><div id="rf"><form class="rf" novalidate onsubmit="return rs(this)"><label class="t" for="rn">Аты-жөніңіз</label><input id="rn" name="n" type="text" autocomplete="name" value="${esc(CFG.guest||'')}" placeholder="Мысалы, Әсем Нұрланқызы"><div class="err" id="re" role="alert"></div><div class="ch" role="radiogroup" aria-label="Қатысуыңыз">${['Келемін','Жұбайыммен келемін','Отбасыммен келемін','Өкінішке орай, келе алмаймын'].map(a=>`<label><input type="radio" name="a" value="${a}"><span class="o"></span>${a}</label>`).join('')}</div><div class="rcw" id="rcw"><label class="t" for="rc">Неше адам келеді?</label><input id="rc" name="c" type="number" min="1" max="20" value="1" inputmode="numeric"></div><button class="send" type="submit">Жауапты жіберу</button></form></div></section>`;
h+=`<section class="pn end"><h2 class="hd">${esc(D.bye||'Жұлдызды түнде, тойда кездескенше!')}</h2>${p?`<p class="dl">${pd(p[2])} · ${pd(p[1])} · ${p[0]}</p>`:''}${(D.groom===DEFS.groom&&!D.photo)?'<p class="demo">Үлгі: аттар мен мекенжай ойдан алынған</p>':''}</section>`;
return h}
document.addEventListener('change',e=>{if(e.target&&e.target.name==='a'){const w=$('rcw');if(w)w.hidden=/келе алмаймын/.test(e.target.value)}});
function rs(f){const n=f.n.value.trim();if(!n){$('re').textContent='Атыңызды жазыңыз, сонда кім келетінін білеміз.';f.n.focus();return false}
const ck=f.querySelector('input[name=a]:checked');if(!ck){$('re').textContent='Келетініңізді немесе келе алмайтыныңызды белгілеңіз.';return false}$('re').textContent='';
const a=ck.value,c=/келе алмаймын/.test(a)?'0':String(Math.max(1,Math.min(20,parseInt(f.c.value)||1)));const bt=f.querySelector('.send');bt.disabled=true;bt.textContent='Жіберілуде…';sendR({n,a,t:c});
setTimeout(()=>{$('rf').innerHTML=`<div class="ok">Рақмет, ${esc(n)}!<small>${c==='0'?'Жауабыңыз жетті. Сізді сағынып еске аламыз.':'Жауабыңыз жетті. Тойда кездескенше!'}</small></div>`},350);return false}
function sendR(x){if(CFG.sa&&CFG.rid){parent.postMessage({toi:'rsvp',rid:CFG.rid,r:x},'*');return}if(CFG.sa){if(CFG.wa)(function(u){var a=document.createElement('a');a.href=u;a.target='_blank';a.rel='noopener';document.body.appendChild(a);a.click();setTimeout(function(){a.remove()},500)})('https://wa.me/'+CFG.wa+'?text='+encodeURIComponent((CFG.title?CFG.title+'\n':'')+x.n+' — '+x.a+(x.t&&x.t!=='0'?' ('+x.t+' адам)':'')))}else parent.postMessage({toi:'rsvp',id:CFG.id,r:x},'*')}
function tick(){const e=$('cd'),p=dp();if(!e||!p)return;const[hh,mm]=String(D.time||'00:00').split(':').map(Number);let s=Math.max(0,Math.floor((new Date(p[0],p[1]-1,p[2],hh||0,mm||0)-new Date())/1000));const v=[Math.floor(s/86400),Math.floor(s%86400/3600),Math.floor(s%3600/60),s%60];e.querySelectorAll('b').forEach((b,i)=>{const t=i?pd(v[i]):String(v[i]);if(b.textContent!==t)b.textContent=t})}

/* scroll drives the day: dawn at the top, noon in the middle, dusk at the answer, night at the end */
function prog(){const m=Math.max(1,document.documentElement.scrollHeight-innerHeight);return Math.min(1,Math.max(0,scrollY/m))}
function onScroll(){if(!opened)return;const k=prog();setT(.25+k*.7);W.P=k*.6;const r=$('rsvp');if(r){const b=r.getBoundingClientRect();const v=Math.max(0,Math.min(b.bottom,innerHeight)-Math.max(b.top,0))/innerHeight;const y=1-Math.min(1,v*1.6);if(Math.abs(y-W.Y)>.02){W.Y=y;W.dirty=true}}}
addEventListener('scroll',onScroll,{passive:true});

function heroIn(){if(!G||CFG.cover)return;const ch=document.querySelectorAll('.nm .ch');const tl=gsap.timeline();
tl.from(ch,{opacity:0,y:18,filter:'blur(6px)',duration:1.1,ease:'power3.out',stagger:.06})
 .from('.nm .amp',{opacity:0,duration:.9},'-=.8')
 .fromTo('.orn path',{strokeDasharray:1,strokeDashoffset:1},{strokeDashoffset:0,duration:1.4,ease:'power2.inOut',stagger:.1},'-=.7')
 .from('.hero .sub,.hero .dl',{opacity:0,y:10,duration:.8,stagger:.15,ease:'power2.out'},'-=1')}
let CTX=null;
function motion(){if(CTX){CTX.revert();CTX=null}if(!G||CFG.cover||!window.ScrollTrigger)return;gsap.registerPlugin(ScrollTrigger);
CTX=gsap.context(()=>{const st=(el,s)=>({trigger:el,start:s||'top 62%'});
gsap.utils.toArray('.pn:not(.hero) .hd').forEach(hd=>{hd.innerHTML=hd.textContent.split(' ').map(w=>`<span class="wm"><span>${esc(w)}</span></span>`).join(' ');gsap.from(hd.querySelectorAll('.wm>span'),{yPercent:105,duration:.9,ease:'power3.out',stagger:.07,scrollTrigger:st(hd,'top 80%')})});
document.querySelectorAll('.pn[data-m="greet"] .p').forEach(p=>gsap.from(p,{opacity:0,duration:1.4,ease:'power1.out',scrollTrigger:st(p,'top 85%')}));
const dd=document.querySelector('[data-m="date"] .d');if(dd){gsap.from(dd,{opacity:0,scale:.86,filter:'blur(10px)',transformOrigin:'0 100%',duration:1.3,ease:'expo.out',scrollTrigger:st(dd,'top 85%')});gsap.from('[data-m="date"] .m,[data-m="date"] .tm',{opacity:0,x:24,duration:.9,stagger:.12,ease:'power3.out',scrollTrigger:st(dd,'top 85%')})}
const cd=$('cd');if(cd){gsap.from(cd,{'--x':0,opacity:0,duration:.6,scrollTrigger:st(cd,'top 88%')});gsap.from(cd.querySelectorAll('div'),{y:14,opacity:0,stagger:.08,duration:.7,ease:'power2.out',scrollTrigger:st(cd,'top 88%')})}
gsap.utils.toArray('[data-m="pg"] li').forEach((li,i)=>gsap.from(li,{x:-18,opacity:0,duration:.7,ease:'power3.out',delay:i*.06,scrollTrigger:st(li,'top 92%')}));
gsap.from('[data-m="dc"] .dcs i',{scale:0,duration:.7,ease:'back.out(2)',stagger:.12,scrollTrigger:st('[data-m="dc"] .dcs','top 90%')});
},$('inv'))}

function openInv(){if(opened)return;opened=true;try{navigator.vibrate&&navigator.vibrate(10)}catch(e){}
if(!CFG.sa&&mi()>=0)parent.postMessage({toi:'play',i:mi()},'*');else if(CFG.sa&&CFG.audio)play();
const done=()=>{$('op').classList.add('gone');document.body.classList.remove('lk');if(window.ScrollTrigger)ScrollTrigger.refresh();onScroll()};
if(!G){setT(.25);done();heroIn();return}
const o={T:W.T};gsap.to('#op>*',{opacity:0,y:12,duration:.5,ease:'power2.in',stagger:.05});
gsap.to(o,{T:.25,duration:4.2,ease:'sine.inOut',onUpdate:()=>setT(o.T),onComplete:done});
gsap.delayedCall(2.3,()=>{gsap.set('#inv',{opacity:1});heroIn()})}

function draw(){$('who').innerHTML=`${esc(D.groom)} мен ${esc(D.bride)}<br>сізді тойға шақырады`;$('inv').innerHTML=inv();tick();motion()}
draw();setInterval(tick,1000);
if(opened||CFG.cover){$('op').classList.add('gone');document.body.classList.remove('lk');setT(CFG.cover?.27:.25);if(CFG.cover){document.body.classList.add('lk')}}
else{if(G)gsap.set('#inv',{opacity:0});$('dawn').addEventListener('click',e=>{e.stopPropagation();openInv()});$('op').addEventListener('click',openInv)}
function ui(){const b=$('mb');b.classList.toggle('on',pp);b.setAttribute('aria-label',pp?'Музыканы тоқтату':'Музыканы қосу');b.style.display=(CFG.sa?!!CFG.audio:mi()>=0)?'':'none'}
function play(){if(CFG.sa){if(!CFG.audio)return;if(!window._au){window._au=new Audio(CFG.audio);_au.loop=true;_au.onplay=()=>{pp=true;ui()};_au.onpause=()=>{pp=false;ui()}}if(_au.paused)_au.play().catch(()=>0);else _au.pause();return}if(mi()>=0)parent.postMessage({toi:'play',i:mi()},'*')}
ui();
window.addEventListener('message',e=>{const m=e.data;if(!m||!m.toi)return;if(m.toi==='set'){D=Object.assign(D,m.D);draw();ui()}if(m.toi==='state'){pl=m.pl;pp=m.pp;ui()}});
<\/script>
</body></html>
